name: CI

# W487 — fast feedback loop (Linux) on every push/PR, before any iOS build is triggered.
# codemagic stays the last-line gate; this catches reds at commit time on the Windows-dev flow.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Unit tests + bundle integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The economy math (XP/rank/compound/difficulty/shields) — zero deps, exits non-zero on red.
      - name: Unit tests (economy math)
        run: node lib/economy.test.js

      # W480-class guard: every local <script src> index.html references must exist on disk, so a
      # path-bearing JS file (like lib/economy.js) can never be silently omitted from the bundle.
      - name: Bundle completeness (index.html script graph)
        run: |
          set -e
          MISSING=0
          SCRIPTS=$(grep -oE '<script[^>]+src="[^"]+"' index.html | sed -E 's/.*src="([^"]+)".*/\1/' | sed -E 's/\?v=[0-9]+$//' | grep -vE '^https?:')
          echo "Scripts referenced by index.html:"; echo "$SCRIPTS"
          for js in $SCRIPTS; do
            if [ ! -f "$js" ]; then echo "FAIL: index.html references <script src=\"$js\"> but $js is missing on disk"; MISSING=1; fi
          done
          if [ "$MISSING" != "0" ]; then exit 1; fi
          echo "OK: all referenced scripts present."

      # W507 — E2E spec-count floor. The Playwright smoke suite (W500) is the behavioral safety
      # net for the monolith; this guards against it silently SHRINKING — a spec deleted or
      # renamed away would drop coverage with no red flag, since a smaller-but-passing suite
      # still goes green. Counts top-level test() calls across tests/e2e/*.spec.ts and fails if
      # the total falls below the floor. Raise FLOOR deliberately when you ADD specs; the only
      # way it drops is an intentional edit here, which shows up in review.
      - name: E2E spec-count floor
        run: |
          set -e
          FLOOR=29
          COUNT=$(cat tests/e2e/*.spec.ts | grep -cE '^[[:space:]]*test\(')
          echo "E2E spec count: $COUNT (floor $FLOOR)"
          if [ "$COUNT" -lt "$FLOOR" ]; then
            echo "FAIL: e2e spec count $COUNT is below the floor of $FLOOR — specs were removed."
            echo "If this was intentional, lower FLOOR in .github/workflows/ci.yml in the same change."
            exit 1
          fi
          echo "OK: spec count at or above floor."

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    # W492 — RUNS the Playwright smoke on every push (cross-platform via serve.mjs — was Windows-only
    # serve.ps1, which couldn't run on Linux CI).
    # W500 — now a BLOCKING gate: continue-on-error was dropped after the suite went green locally
    # (all 28 specs, twice). The 6 UI specs that had rotted were repaired to the current DOM
    # (cinematic-onboarding seed, redesigned Add-Habits chip flow, dormant leaderboard hub, custom
    # icon-choice gate). retries:1 (playwright.config) absorbs transient modal-timing flake; if a real
    # UI break lands it now red-walls the push instead of silently rotting.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke suite (served by serve.mjs)
        env:
          CI: 'true'
        run: npx playwright test
