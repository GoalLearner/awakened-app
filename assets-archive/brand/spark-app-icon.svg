<?xml version="1.0" encoding="UTF-8"?>
<!--
  spark-app-icon.svg — 1024x1024 composed app icon source.
  Navy gradient background + Spark mark centered at 62% of icon edge
  (≈ 635px), per ClaudeDesign brand pack safe-margin spec.

  iOS applies its own corner mask (22.37% superellipse), so this
  source is a flat square. Background is fully opaque -- Apple
  rejects transparent app icons. Mark is gold #f5b842 with NO
  drop-shadow / glow filter (filters get baked into the raster and
  read as halos at small sizes).

  Used as input to scripts/generate-spark-icon-source.ps1 (or any
  SVG rasterizer) → app-icon-source.png at 1024x1024 RGB →
  scripts/generate-app-icons.ps1 produces every iOS + PWA size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#14143a"/>
      <stop offset="100%" stop-color="#08081a"/>
    </linearGradient>
  </defs>

  <!-- Solid navy gradient background (no transparency for Apple). -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Spark mark at 62% of icon edge (635px) centered. The mark uses
       its own 100×100 viewBox internally and inherits via transform. -->
  <g transform="translate(194.5, 194.5) scale(6.35)">
    <!-- Triangle outline. Stroke width scales with the group transform,
         so 3.5 here renders as ~22px on the 1024 canvas — readable at
         every iOS icon size after downsample. -->
    <path d="M50 12 L84 82 L16 82 Z"
          fill="none"
          stroke="#f5b842"
          stroke-width="3.5"
          stroke-linejoin="round"
          vector-effect="non-scaling-stroke"
          style="stroke-width: 22"/>

    <!-- Rune notches at the three vertices. -->
    <g stroke="#f5b842" stroke-width="12" stroke-linecap="round">
      <path d="M48 14 L52 14"/>
      <path d="M18 84 L22 80"/>
      <path d="M82 84 L78 80"/>
    </g>

    <!-- Solid gold flame inside the triangle. -->
    <path d="M50 34 C 42 48 42 60 50 66 C 58 60 58 48 50 34 Z"
          fill="#f5b842"/>
  </g>
</svg>
