<?xml version="1.0" encoding="UTF-8"?>
<!--
  spark.svg — The Spark · canonical Awakened brand mark (v3 Phase 1z.26).
  "The discipline within. A contained fire that does not go out."

  Geometry per ClaudeDesign brand pack:
    viewBox            : 0 0 100 100
    triangle (outline) : M50 12 L84 82 L16 82 Z
    flame (solid)      : M50 34 C 42 48 42 60 50 66 C 58 60 58 48 50 34 Z
    rune notches       : 3 short stroke segments at the vertices
    stroke             : 3.5px (4px below 40px render size)
    gold               : #f5b842 (Awakened gold token)

  Usage:
    - Inline in markup (splash, in-app brand surfaces)
    - Composited into app-icon-source.png via
      scripts/generate-spark-icon-source.ps1
    - Variants: see spark-app-icon.svg for the 1024x1024 composed icon
      with navy background
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Triangle: gold outline, apex up. Rounded joins per spec. -->
  <path d="M50 12 L84 82 L16 82 Z"
        fill="none"
        stroke="#f5b842"
        stroke-width="3.5"
        stroke-linejoin="round"/>

  <!-- Rune notches at each vertex. Stroke segments for crisp small-size render. -->
  <g stroke="#f5b842" stroke-width="2" stroke-linecap="round">
    <path d="M48 14 L52 14"/>
    <path d="M18 84 L22 80"/>
    <path d="M82 84 L78 80"/>
  </g>

  <!-- Flame: solid gold teardrop centered in the triangle. -->
  <path d="M50 34 C 42 48 42 60 50 66 C 58 60 58 48 50 34 Z"
        fill="#f5b842"/>
</svg>
