# wrangler.toml — Cloudflare Worker config for the Awakened backend.
#
# Source of truth for backend deploys. Every wrangler command run from
# the /backend/ subdirectory reads this. See ../BACKEND.md §10 for the
# full deploy procedure and secrets list.
#
# ── Worker identity ──────────────────────────────────────────────
# name:               Worker name on Cloudflare. URL becomes
#                     awakened-backend.<workers-subdomain>.workers.dev
# main:               Entry-point TS file (typescript-to-worker bundling
#                     handled by Wrangler 4 automatically)
# compatibility_date: Pins the Workers runtime feature set; date is
#                     when the Worker code was last validated against
#                     Cloudflare's runtime. Bump in deliberate steps,
#                     not every release.
# account_id:         Cloudflare account identifier
# workers_dev:        true → publishes to *.workers.dev subdomain
#                     (no custom domain needed for v2.1)
name = "awakened-backend"
main = "src/index.ts"
compatibility_date = "2026-05-12"
compatibility_flags = ["nodejs_compat"]
account_id = "2bfe4268082103ba069c1f65f500ad54"
workers_dev = true
# W603 — do NOT let `wrangler deploy` delete vars/secrets configured in the
# Cloudflare dashboard but absent from this file. The APNs config is set in the
# dashboard (APNS_AUTH_KEY = encrypted secret, APNS_KEY_ID = plaintext var);
# without this, a deploy could wipe the plaintext APNS_KEY_ID and silently
# disable push. Secrets are preserved regardless, but this protects the var too.
keep_vars = true

# ── Cron triggers (src/index.ts scheduled()) ─────────────────────────────────
# "*/5 16-17 * * MON" — W680 Monday "update available" push broadcast. Fires every 5
#   minutes across the 16:00–17:59 UTC window on Mondays; the job
#   (src/lib/update-push.ts) only proceeds when it is 9 AM America/Los_Angeles, which
#   the 2-hour window covers in BOTH DST phases (16 UTC = 9 AM PDT; 17 UTC = 9 AM PST) —
#   the other hour's runs leave one SKIP_GATE heartbeat row in cron_runs. Since W904 the
#   job runs on EVERY trigger (self-gated), so the 2-minute sweep below also carries it
#   inside the Monday window; each eligible run sends one bounded, CAS-claimed page.
# "*/2 * * * *" — W702 raid-finder background matchmaking sweep (runRaidMatchmakeSweep):
#   every 2 minutes, pairs queued members into raid parties so nobody has to babysit the
#   finder screen. Tiny D1 sweep scoped to matchmaking bosses; well within the plan.
[triggers]
# W904 — weekday is NAMED on purpose. Cloudflare numbers the day-of-week field
# 1 = Sunday … 7 = Saturday (NOT POSIX 0-6): the original "*/5 16-17 * * 1" fired
# every SUNDAY for seven weeks while the Monday gate in lib/update-push.ts silently
# refused. src/lib/cron-config.test.ts pins this line and rejects bare numeric weekdays.
crons = ["*/5 16-17 * * MON", "*/2 * * * *"]

# ── D1 database binding ──────────────────────────────────────────
# binding:       In-Worker variable name (accessed as env.DB from
#                src/index.ts and src/db-related modules).
# database_name: Cloudflare-side DB name (must match `wrangler d1
#                create` call). Used by CLI commands like
#                `wrangler d1 execute awakened-db --remote ...`
# database_id:   Cloudflare's UUID for the DB. SET BY HUMAN after
#                running `wrangler d1 create awakened-db` for the
#                first time. Currently PENDING_PAUSE_1 — Richie
#                creates the DB during PAUSE 1 of Phase B and pastes
#                the ID back so it can be filled in here.
[[d1_databases]]
binding = "DB"
database_name = "awakened-db"
database_id = "b9c67e10-c88c-4b71-b1e0-413d1e84a5fa"

# ── Durable Objects — realtime human PvP (PVP.md §21) ────────────
# One MatchRoom instance per match, addressed by idFromName(matchCode); it owns
# the authoritative battle + both players' WebSocket sessions. SQLite-backed
# (new_sqlite_classes). WebSocket Hibernation is supported by the
# compatibility_date above. NOTE: SQLite-backed Durable Objects (new_sqlite_classes,
# used here) run on the Workers FREE plan (since April 2025) — no plan upgrade
# needed. KV-style storage.get/put map transparently to a hidden SQLite table.
[[durable_objects.bindings]]
name = "MATCH"
class_name = "MatchRoom"

[[migrations]]
tag = "v1-pvp"
new_sqlite_classes = ["MatchRoom"]

# ── Secrets (set via `wrangler secret put NAME`) ─────────────────
# Not declared here — secret values never appear in this file.
# Set via Wrangler CLI prior to first deploy:
#   wrangler secret put JWT_SIGNING_KEY
#   wrangler secret put APPLE_BUNDLE_ID
#   wrangler secret put APPLE_TEAM_ID
#   wrangler secret put REVENUECAT_WEBHOOK_AUTH
#   wrangler secret put ADMIN_METRICS_SECRET   # gates GET /v1/admin/retention (owner metrics)
#   wrangler secret put APNS_AUTH_KEY          # W603 push — the .p8 auth-key contents (PEM)
#   wrangler secret put APNS_KEY_ID            # W603 push — the 10-char Key ID of that .p8
# (APNs also reuses the existing APPLE_TEAM_ID + APPLE_BUNDLE_ID secrets.)
# Each secret prompts for the value at the CLI. Values are encrypted
# at rest in Cloudflare's secret store. See BACKEND.md §10 for the
# canonical secret list and capture instructions.

# ── Rate-limiter bindings ────────────────────────────────────────
# Cloudflare's Rate Limiting API supports `period` of 10 or 60 seconds
# only. BACKEND.md §8 spec'd "12/hour" and "3/hour" caps which we
# approximate with the tightest valid 60s period below (≈ same daily
# usage cap but allows higher burst). Real abuse > burst still gets
# caught. Client-side debounce in auth.js / lbSubmitSnapshot() keeps
# legit usage well under these.
#
# namespace_id values 1001-1004 are arbitrary identifiers — they
# need only be unique within this Worker. The binding `name` is what
# code accesses as `env.<NAME>`.

[[unsafe.bindings]]
name = "RL_AUTH_VERIFY"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }  # 10/min per IP

[[unsafe.bindings]]
name = "RL_LEADERBOARD_SUBMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 2, period = 60 }   # 2/min per user (≈ spec's 12/hour)

[[unsafe.bindings]]
name = "RL_LEADERBOARD_TOP"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 30, period = 60 }  # 30/min per user

[[unsafe.bindings]]
name = "RL_ACCOUNT_DELETE"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 3, period = 60 }   # 3/min per user (≈ spec's 3/hour)

# Cloud Sync v1 (v3 Phase 1w) — two new endpoints share the budget
# with the leaderboard submitter. State GETs are read-only and cheap;
# allow more. POSTs are larger payloads and client debounces to
# 30-60s already; keep tight to defend against pathological clients.
[[unsafe.bindings]]
name = "RL_USER_STATE_GET"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 12, period = 60 }  # 12/min per user

[[unsafe.bindings]]
name = "RL_USER_STATE_POST"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 4, period = 60 }   # 4/min per user — debounced client

# Discipline Duels v1 (v3 Phase 1x). Friends + duels coordination layer.
# Reads are cheap; writes are infrequent (1-2/day legit usage).
[[unsafe.bindings]]
name = "RL_FRIENDS_READ"
type = "ratelimit"
namespace_id = "1007"
simple = { limit = 30, period = 60 }  # 30/min per user

[[unsafe.bindings]]
name = "RL_FRIENDS_WRITE"
type = "ratelimit"
namespace_id = "1008"
simple = { limit = 10, period = 60 }  # 10/min per user

# v3 Phase 1z.279 — Duels permanently retired. RL_DUELS_READ binding
# (namespace_id 1009) removed. RL_DUELS_WRITE (namespace_id 1010)
# kept because handleDuelsResolve and handleVerifiedEventsSubmit
# still use it.
[[unsafe.bindings]]
name = "RL_DUELS_WRITE"
type = "ratelimit"
namespace_id = "1010"
simple = { limit = 6, period = 60 }   # 6/min per user

# W663 — dedicated bucket for the INTERACTIVE friend-Echo summon. Same fix class
# as RL_COOP_WRITE (W463): handlePvpEchoFriend used to share RL_DUELS_WRITE (6/min)
# with the co-op step-submission drain (/v1/verified-events → handleVerifiedEventsSubmit),
# so a hunter with a live co-op hunt 429'd on their FIRST Echo tap ("slow down a
# moment, then try again"). Its own 20/min namespace so a single tap always has
# budget (one summon = one token). Ranked create/join/find/rematch keep RL_DUELS_WRITE.
[[unsafe.bindings]]
name = "RL_PVP_WRITE"
type = "ratelimit"
namespace_id = "1024"
simple = { limit = 20, period = 60 }  # 20/min per user

# 100K Step Club + future accolades (v3 Phase 1z.27). Authenticated
# read of the user's own accolade list. Cheap (single PK-indexed
# scan with bounded row count). Client fetches once per app session
# + once after a step_total submit crosses 100K. 12/min gives ample
# headroom for visibilitychange refreshes without inviting abuse.
[[unsafe.bindings]]
name = "RL_USER_ACCOLADES_READ"
type = "ratelimit"
namespace_id = "1011"
simple = { limit = 12, period = 60 }  # 12/min per user

# Weekly Steps Hall of Fame (v3 Phase 1z.36). Authenticated read of
# the all-time top weekly step records. Two D1 queries per request
# (top-N JOIN + me_best lookup with rank count). 30/min mirrors
# the existing leaderboard-top budget so a user toggling between
# the "This Week" and "Hall of Fame" tabs doesn't trip either limit.
[[unsafe.bindings]]
name = "RL_LEADERBOARD_HOF"
type = "ratelimit"
namespace_id = "1012"
simple = { limit = 30, period = 60 }  # 30/min per user

# 100K Step Club roster (v3 Phase 1z.52). Authenticated read of
# the user_accolades table filtered to step_100k_club entries,
# joined to users for live alias and filtered to exclude sim users.
# Three D1 queries per request (top-N JOIN + me lookup + me rank).
# Same 30/min budget as HoF -- a user toggling between the three
# tabs (This Week / Hall of Fame / 100K Club) won't trip any limit.
[[unsafe.bindings]]
name = "RL_LEADERBOARD_STEP_100K_CLUB"
type = "ratelimit"
namespace_id = "1013"
simple = { limit = 30, period = 60 }  # 30/min per user

# Friend rank badges MVP (v3 Phase 1z.190). Authenticated upsert of
# the caller's public_profile_summary row. The client debounces
# submits to rank-label changes + a daily heartbeat, so 6/min is
# comfortably above legit usage and far below abuse. Single D1
# UPSERT per request.
[[unsafe.bindings]]
name = "RL_PUBLIC_PROFILE_WRITE"
type = "ratelimit"
namespace_id = "1014"
simple = { limit = 6, period = 60 }   # 6/min per user

# Public friend activity events MVP-B (v3 Phase 1z.200). Batch
# write of allowlisted public events (boss_kill, rank_up,
# step_milestone_bucket). 12/min × up to 10 events per request =
# 120 events/min sustained, well above legit play volume.
[[unsafe.bindings]]
name = "RL_PUBLIC_EVENTS_WRITE"
type = "ratelimit"
namespace_id = "1015"
simple = { limit = 12, period = 60 }  # 12/min per user

# Public friend activity events MVP-B (v3 Phase 1z.200). Friend-
# scoped read for the Guild Activity feed. Matches the existing
# read-budget convention for the other friend-adjacent reads.
[[unsafe.bindings]]
name = "RL_PUBLIC_EVENTS_READ"
type = "ratelimit"
namespace_id = "1016"
simple = { limit = 30, period = 60 }  # 30/min per user

# The Hall of the Awakened (W270). Once-ever finish write — tiny
# budget, just enough to survive a flaky-network retry.
[[unsafe.bindings]]
name = "RL_HALL_WRITE"
type = "ratelimit"
namespace_id = "1017"
simple = { limit = 6, period = 60 }  # 6/min per user

# The Hall of the Awakened (W270). Roll read — matches the other
# friend-adjacent read budgets.
[[unsafe.bindings]]
name = "RL_HALL_READ"
type = "ratelimit"
namespace_id = "1018"
simple = { limit = 30, period = 60 }  # 30/min per user

# Co-op duo bosses (W463). DEDICATED bucket for all co-op WRITE endpoints
# (create / join / cancel / decline / resolve). Previously these shared
# RL_DUELS_WRITE (6/min), so a co-op JOIN could 429 off a bucket already
# drained by a recent duel/resolve write — the user's "first JOIN tap does
# nothing, retry works" bug. 20/min comfortably covers join + the resolve
# poll/background catch-up while still bounding abuse (each write is a cheap
# state transition).
[[unsafe.bindings]]
name = "RL_COOP_WRITE"
type = "ratelimit"
namespace_id = "1019"
simple = { limit = 20, period = 60 }  # 20/min per user

# Per-user retention tracking (owner-requested). Guards POST /v1/users/me/app-open
# — a fire-and-forget lifecycle ping written on launch + foreground. The write is
# a single UPSERT deduped per UTC day server-side, and the client throttles to
# ~5-min intervals, so legit usage is a handful per session. 6/min is far above
# that and bounds a misbehaving client.
[[unsafe.bindings]]
name = "RL_APP_OPEN"
type = "ratelimit"
namespace_id = "1020"
simple = { limit = 6, period = 60 }   # 6/min per user

# Realtime PvP action guard (W585 — security audit hardening). The HTTP PvP
# move endpoints (submit / forfeit / rematch-decline / state) forward to the
# MatchRoom Durable Object; previously they had NO rate limit, so a script
# could amplify DO invocations against the operator's Cloudflare bill (the DO
# still rejects non-participants, so it's a cost nuisance, not a game exploit).
# 60/min = one action/sec: far above real turn-based play (a turn deadline is
# tens of seconds → a few moves/min) and above any reasonable state-poll
# cadence, so it never throttles a live match — it only bounds a runaway loop.
[[unsafe.bindings]]
name = "RL_PVP_ACTION"
type = "ratelimit"
namespace_id = "1021"
simple = { limit = 60, period = 60 }  # 60/min per user

# Push notifications v1 (W603). Guards POST/DELETE /v1/users/me/device-token —
# the client registers its APNs device token once per launch + on token
# rotation, so 6/min is far above legit usage while bounding a misbehaving
# client that spams registrations.
[[unsafe.bindings]]
name = "RL_PUSH_WRITE"
type = "ratelimit"
namespace_id = "1022"
simple = { limit = 6, period = 60 }   # 6/min per user

# Self-healing IAP reconcile (W637). Guards POST /v1/users/me/entitlements/reconcile,
# which reads the caller's authoritative purchases from RevenueCat's REST API and
# grants any missing locally (recovers a lost/delayed webhook + a restored
# already-owned purchase). DEDICATED bucket — the handler makes an external RC call,
# so it must not share a budget. The client calls it after a purchase/restore, so
# 12/min is far above legit usage while bounding a client spamming RevenueCat's API.
[[unsafe.bindings]]
name = "RL_IAP_RECONCILE"
type = "ratelimit"
namespace_id = "1023"
simple = { limit = 12, period = 60 }  # 12/min per user

# W723 — Weekly Insights (members-only) percentile read. A single fetch when
# the member opens "Your Weekly Awakening"; 30/min is far above legit usage.
[[unsafe.bindings]]
name = "RL_INSIGHTS_READ"
type = "ratelimit"
# W739 SECURITY — was "1024", colliding with RL_PVP_WRITE (both key on session.userId),
# so the two shared one counter + conflicting limits. Moved to a unique id.
namespace_id = "1025"
simple = { limit = 30, period = 60 }  # 30/min per user

# W746 — client error ingestion (POST /v1/users/me/client-errors). The client
# self-caps per session; 6/min bounds a crash-looping device.
[[unsafe.bindings]]
name = "RL_CLIENT_ERRORS"
type = "ratelimit"
namespace_id = "1026"
simple = { limit = 6, period = 60 }  # 6/min per user

# W907 — Community board. Two dedicated buckets (the W463/W663 lesson: never
# share a write bucket between an interactive tap and anything else).
# namespace_id must be unique in this Worker (W739: 1024 once collided) —
# 1027/1028 are the next free ids.
[[unsafe.bindings]]
name = "RL_BOARD_WRITE"
type = "ratelimit"
namespace_id = "1027"
simple = { limit = 6, period = 60 }  # 6/min per user — topics, replies, reports, blocks, moderation

[[unsafe.bindings]]
name = "RL_BOARD_READ"
type = "ratelimit"
namespace_id = "1028"
simple = { limit = 30, period = 60 }  # 30/min per user — board + topic reads
