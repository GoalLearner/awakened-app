# ═══════════════════════════════════════════════════════════════════
# codemagic.yaml — Awakened iOS Build & App Store Pipeline
# ═══════════════════════════════════════════════════════════════════
#
# BEFORE YOUR FIRST BUILD — complete these steps in Codemagic:
#
#  1. Connect GitHub repo at: codemagic.io → Add application
#  2. Create an App Store Connect API key integration:
#       Team Settings → Integrations → App Store Connect
#       Name it exactly: Codemagic
#  3. Create your app in App Store Connect (apps.apple.com)
#       then paste its numeric App ID into APP_STORE_ID below
#  4. Automatic code signing is handled by Codemagic — no manual
#       certificate management needed.
#
# ═══════════════════════════════════════════════════════════════════

workflows:

  ios-app-store:
    name: Awakened — iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m1

    # ── App Store Connect integration ──────────────────────────────
    # Must match the connection name created in your Codemagic dashboard
    integrations:
      app_store_connect: Codemagic

    environment:

      # ── Automatic code signing ─────────────────────────────────
      # Codemagic fetches and manages certificates & profiles for you
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.goallearner.awakened

      # ── Build variables ────────────────────────────────────────
      vars:
        BUNDLE_ID:        "com.goallearner.awakened"
        APP_VERSION:      "2.0.2"
        XCODE_WORKSPACE:  "ios/App/App.xcworkspace"
        XCODE_SCHEME:     "App"
        # ↓ Replace with your numeric App ID from App Store Connect
        #   Find it at: appstoreconnect.apple.com → My Apps → App Information
        APP_STORE_ID:     "6764727990"

      node:      v24.15.0
      xcode:     latest
      cocoapods: default

    # ── Build steps ────────────────────────────────────────────────
    scripts:

      - name: Install Node dependencies
        script: npm install

      - name: Copy PWA files into www/ for Capacitor
        script: |
          mkdir -p www
          cp index.html styles.css app.js auth.js sw.js manifest.json www/
          # Class avatar silhouettes
          cp avatar-*.png www/
          # PWA app-icons (rendered from app-icon-source.png by
          # scripts/generate-app-icons.ps1; checked into the repo).
          cp icon-192.png icon-512.png www/
          # Tab-bar icons (DALL-E art) — copy only the optimized 192×192 PNGs
          # into www/. The 1254×1254 *-source.png masters stay in the repo
          # but must NOT ship in the iOS bundle (16 MB of dead weight).
          mkdir -p www/assets/tab-icons
          for icon in tab-status tab-habits tab-stats tab-history tab-dungeon tab-items tab-social; do
            cp "assets/tab-icons/$icon.png" "www/assets/tab-icons/$icon.png"
          done
          # Stat icons (DALL-E art) — same pattern as tab icons.
          mkdir -p www/assets/stat-icons
          for icon in stat-str stat-vit stat-int stat-focus stat-will stat-wlt; do
            cp "assets/stat-icons/$icon.png" "www/assets/stat-icons/$icon.png"
          done
          # Habit icons (DALL-E art) — full curated coverage. Same
          # pattern: only the optimized 192×192 PNGs ship; the 600×600
          # *-source.png masters stay out of www/.
          mkdir -p www/assets/habit-icons
          for icon in icon-water icon-sleep icon-wake icon-walk icon-cardio icon-strength icon-sunlight icon-gratitude icon-vitamins icon-meditate icon-nutrition icon-nophone icon-business icon-cold icon-connection icon-finance icon-grounding icon-journal icon-learning icon-mobility icon-noalcohol icon-nocaffeine icon-nodoomscroll icon-noscreen-bed icon-nosugar icon-protein icon-read icon-target icon-tidy icon-sprint icon-nosocial icon-priority icon-plan-tomorrow icon-screen-cap icon-podcast icon-pray icon-visualize icon-pack-morning icon-pack-lockedin icon-pack-custom icon-streak icon-xp icon-class-civilian icon-class-warrior icon-class-ranger icon-class-mage icon-class-assassin icon-class-paladin icon-class-merchant icon-class-sage; do
            cp "assets/habit-icons/$icon.png" "www/assets/habit-icons/$icon.png"
          done
          # Dungeon gate art (v2.0.2). Each rank tier gets one gate
          # PNG. E-rank exists today; D/C/B/A/S/SS land as bosses fill
          # those tiers. Add new gate filenames to the loop below.
          mkdir -p www/assets/gates
          for gate in gate-e-rank gate-d-rank gate-c-rank gate-b-rank gate-a-rank gate-s-rank; do
            cp "assets/gates/$gate.png" "www/assets/gates/$gate.png"
          done
          # Boss illustrations (CARDS.md spec preview). 1254×1254 manhwa
          # portraits ride inside the new card's art window.
          mkdir -p www/assets/bosses
          for boss in the-insomniac the-carouser the-steel-wolf; do
            cp "assets/bosses/$boss.png" "www/assets/bosses/$boss.png"
          done
          # General-purpose UI icons (v2.0.1). Currently just the souls
          # currency icon; future utility icons (XP, drops, etc.) can
          # land here too. Distinct from habit-icons (which is now
          # de-facto habit-specific again).
          mkdir -p www/assets/icons
          for icon in souls-icon; do
            cp "assets/icons/$icon.png" "www/assets/icons/$icon.png"
          done
          # Item / equipment card art (v2.0.1 DROPS Phase 1). 1254×1254
          # DALL-E portraits, one per card in the CARDS constant. Copy
          # every PNG present — files that don't exist yet (8 of 9 at
          # launch) simply aren't copied and the renderer falls back to
          # the emoji + rarity gradient placeholder. Add cards to disk
          # as art lands; no codemagic edit required for the new ones.
          mkdir -p www/assets/items
          if compgen -G "assets/items/*.png" > /dev/null; then
            cp assets/items/*.png www/assets/items/
          fi

      - name: Add iOS platform (runs on first build only)
        script: |
          if [ ! -d ios ]; then
            # cap add scaffolds the iOS project + runs pod install
            # internally. Pod install will FAIL with the default
            # deployment target (iOS 13.0) because
            # @capacitor-community/apple-sign-in v7.1.0 declares
            # s.ios.deployment_target = '14.0' in its podspec.
            # We tolerate the failure here — the NEXT step bumps the
            # project target to 14.0 and re-runs pod install with
            # the corrected value.
            npx cap add ios || true
          fi

      - name: Bump iOS deployment target to 14.0 (v2.1 Phase A)
        script: |
          # @capacitor-community/apple-sign-in v7.1.0 requires iOS
          # 14.0+. Capacitor 6's default for new iOS scaffolds is
          # 13.0. Without this step CocoaPods rejects the install
          # with "CapacitorCommunityAppleSignIn required a higher
          # minimum deployment target." See BACKEND.md §4.
          #
          # iOS 14 reached ~95% device adoption by mid-2026. Safe
          # cutoff. Idempotent — sed is a no-op once the project is
          # already at 14.0, so this step is safe to run on every
          # build (including cached-ios incremental builds).
          if [ -f ios/App/Podfile ]; then
            sed -i.bak "s/platform :ios, '13.0'/platform :ios, '14.0'/" ios/App/Podfile
            rm -f ios/App/Podfile.bak
            echo "Podfile platform line:"
            grep "platform :ios" ios/App/Podfile
          fi
          if [ -f ios/App/App.xcodeproj/project.pbxproj ]; then
            sed -i.bak "s/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g" ios/App/App.xcodeproj/project.pbxproj
            rm -f ios/App/App.xcodeproj/project.pbxproj.bak
            echo "project.pbxproj deployment target occurrences:"
            grep -c "IPHONEOS_DEPLOYMENT_TARGET = 14.0" ios/App/App.xcodeproj/project.pbxproj
          fi
          # Re-run pod install with the corrected target. Earlier
          # cap add (above) likely failed at pod install; this is
          # the recovery. cd into the App subdir because that's
          # where the Podfile lives.
          cd ios/App && pod install

      - name: Sync web assets into iOS project
        script: npx cap sync ios

      - name: Declare export compliance (no custom encryption)
        script: |
          # Apple requires every iOS build to declare encryption usage.
          # Awakened only uses iOS's standard HTTPS (exempt) — no custom
          # crypto. Setting this key allows TestFlight + App Store
          # auto-submission to skip the manual compliance question.
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          echo "Export compliance flag set."

      - name: Add HealthKit usage description and entitlement
        script: |
          # v1.1.4 — auto-verifies the Daily walk habit using Apple Health step
          # data. We only READ from HealthKit (never write), so only
          # NSHealthShareUsageDescription is strictly required, but we add the
          # update key as well to be safe against reviewer-tooling edge cases.
          PLIST="ios/App/App/Info.plist"
          ENTITLEMENTS="ios/App/App/App.entitlements"

          # ── Info.plist: usage descriptions ─────────────────────────────
          # Wording must match what Apple reviewers see in the permission
          # sheet. Keep it short, honest, and ties data to user value.
          SHARE_DESC="Awakened uses Apple Health to verify your habits and unlock boss battles in future versions. Your data stays on your device."
          UPDATE_DESC="Awakened only reads from Apple Health. It does not write to it."

          /usr/libexec/PlistBuddy -c "Add :NSHealthShareUsageDescription string '$SHARE_DESC'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSHealthShareUsageDescription '$SHARE_DESC'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSHealthUpdateUsageDescription string '$UPDATE_DESC'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSHealthUpdateUsageDescription '$UPDATE_DESC'" "$PLIST"

          # ── App.entitlements: HealthKit capability ─────────────────────
          # Must match the App ID's HealthKit capability in Apple Developer
          # portal. If the IPA fails to install with "Missing entitlement,"
          # confirm HealthKit is enabled on the App ID at developer.apple.com.
          #
          # ONLY write com.apple.developer.healthkit (the basic capability).
          # Do NOT write com.apple.developer.healthkit.access — that key is
          # for Verifiable Health Records (clinical / medical record access)
          # and requires separate Apple approval. Including it without
          # approval makes codesign fail with "Entitlement
          # com.apple.developer.healthkit.access requires approval from
          # Apple to include in a profile." Awakened only reads step counts,
          # which is covered by the basic capability — the .access key is
          # not needed and was a mis-paste from documentation in v1.1.4.
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.healthkit bool true" "$ENTITLEMENTS" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :com.apple.developer.healthkit true" "$ENTITLEMENTS"

          echo "HealthKit Info.plist + entitlement entries set."
          /usr/libexec/PlistBuddy -c "Print :NSHealthShareUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" "$ENTITLEMENTS"

      - name: Add Sign in with Apple entitlement
        script: |
          # v2.1 Phase A — Sign in with Apple capability. Mirrors the
          # HealthKit entitlement pattern. The Apple Developer Portal
          # must also have "Sign in with Apple" enabled on the App ID
          # (com.goallearner.awakened); if codesign rejects the build
          # with "Missing entitlement," confirm the Portal capability.
          # See BACKEND.md §4.
          ENTITLEMENTS="ios/App/App/App.entitlements"
          # The Sign in with Apple entitlement is an array of strings.
          # Apple expects either ['Default'] (normal apps) or
          # ['Default', 'authentication.services'] (services that need
          # the AS framework specifically). For Awakened we use Default.
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin array" "$ENTITLEMENTS" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin:0 string 'Default'" "$ENTITLEMENTS" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :com.apple.developer.applesignin:0 'Default'" "$ENTITLEMENTS"
          echo "Sign in with Apple entitlement set."
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin" "$ENTITLEMENTS"

      - name: Wire entitlements file into Xcode project
        script: |
          # v1.1.5 — bug fix for v1.1.4's silent HealthKit failure.
          # The previous step writes App.entitlements to disk, but
          # Capacitor's default Xcode project does NOT have
          # CODE_SIGN_ENTITLEMENTS set in build settings. Without it,
          # xcodebuild signs the IPA WITHOUT reading our entitlements
          # file → HealthKit entitlement silently absent → iOS rejects
          # requestAuthorization with no error visible to the user.
          # See CLAUDE.md "Common pitfalls" for the full diagnosis.
          #
          # This step uses the xcodeproj Ruby gem (preinstalled on
          # Codemagic macOS images) to set CODE_SIGN_ENTITLEMENTS on
          # both Debug and Release configs of the App target.
          cd ios/App
          ruby -e "
            require 'xcodeproj'
            project_path = 'App.xcodeproj'
            project = Xcodeproj::Project.open(project_path)
            target = project.targets.find { |t| t.name == 'App' }
            raise 'App target not found' unless target
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
              puts \"Set CODE_SIGN_ENTITLEMENTS for #{config.name}\"
            end
            project.save
            puts 'project.pbxproj saved'
          "

      - name: Install custom app icon
        script: |
          # Copy custom AppIcon.appiconset over the Capacitor default
          rm -rf ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp -R resources/ios/AppIcon.appiconset ios/App/App/Assets.xcassets/
          echo "Icon files installed:"
          ls -la ios/App/App/Assets.xcassets/AppIcon.appiconset/

      - name: Refresh provisioning profile (v2.1 Phase A entitlement parity)
        script: |
          set -e
          # Builds 42 and 43 failed at Build IPA with:
          #   "Provisioning profile 'Awakened App Store' doesn't include
          #    the com.apple.developer.applesignin entitlement."
          #
          # The cached "Awakened App Store" profile in App Store Connect
          # predates the Sign in with Apple capability addition on the
          # App ID (v2.1 Phase A enables this). Codemagic's implicit
          # automatic-signing fetch reuses the stale profile instead of
          # regenerating from current capabilities. A manual delete of
          # the profile at developer.apple.com did NOT fix this (build
          # 43 hit the same error verbatim) — either Apple re-created
          # a stale profile or Codemagic served from its own cache.
          #
          # This step force-deletes ALL provisioning profiles bound to
          # the bundle ID via the App Store Connect API, then explicitly
          # fetches signing files with --create so Apple regenerates a
          # fresh profile from the current App ID capability set
          # (HealthKit + Sign in with Apple). Adds ~5-10 seconds per
          # build for guaranteed entitlement parity. Idempotent — once
          # capabilities are stable, recreated profiles are functionally
          # identical, just freshly issued.
          echo "Listing existing IOS_APP_STORE profiles for $BUNDLE_ID..."
          PROFILES_JSON=$(app-store-connect list-profiles \
            --bundle-id-identifier "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --json 2>/dev/null || echo "[]")
          echo "$PROFILES_JSON" | jq -r '.[] | "  \(.id)  \(.attributes.name)"' 2>/dev/null || echo "  (none or jq parse failed)"
          PROFILE_IDS=$(echo "$PROFILES_JSON" | jq -r '.[].id' 2>/dev/null || true)
          if [ -n "$PROFILE_IDS" ]; then
            for id in $PROFILE_IDS; do
              echo "Deleting stale profile: $id"
              app-store-connect provisioning-profiles delete "$id" || true
            done
          else
            echo "No existing profiles found — fetch will create a fresh one."
          fi
          echo "Fetching fresh signing files (forces App Store Connect to regenerate)..."
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Apply code signing profiles
        script: xcode-project use-profiles

      - name: Set version and auto-increment build number
        script: |
          cd ios/App
          # Set marketing version (shown in App Store)
          agvtool new-marketing-version "$APP_VERSION"
          # Auto-increment build number from latest TestFlight upload
          LATEST=$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $((LATEST + 1))

      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    # ── Artifacts to download after build ──────────────────────────
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    # ── Publishing ─────────────────────────────────────────────────
    publishing:
      app_store_connect:
        auth: integration
        # Automatically uploads every successful build to TestFlight
        submit_to_testflight: true
        # Set to true when you are ready to submit for App Store review
        submit_to_app_store: false
