# ═══════════════════════════════════════════════════════════════════
# codemagic.yaml — Awakened iOS Build & App Store Pipeline
# ═══════════════════════════════════════════════════════════════════
#
# BEFORE YOUR FIRST BUILD — complete these steps in Codemagic:
#
#  1. Connect GitHub repo at: codemagic.io → Add application
#  2. Create an App Store Connect API key integration:
#       Team Settings → Integrations → App Store Connect
#       Name it exactly: Codemagic
#  3. Create your app in App Store Connect (apps.apple.com)
#       then paste its numeric App ID into APP_STORE_ID below
#  4. Automatic code signing is handled by Codemagic — no manual
#       certificate management needed.
#
# ═══════════════════════════════════════════════════════════════════

workflows:

  ios-app-store:
    name: Awakened — iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m1

    # ── App Store Connect integration ──────────────────────────────
    # Must match the connection name created in your Codemagic dashboard
    integrations:
      app_store_connect: Codemagic

    environment:

      # ── Manual code signing (v2.1 Phase A pivot) ───────────────
      # Switched from auto-signing (distribution_type: app_store) to
      # manual signing after 7 build cycles confirmed Codemagic's
      # auto-fetch produces profiles WITHOUT the
      # com.apple.developer.applesignin entitlement, even though the
      # App ID has Sign in with Apple correctly configured as primary.
      # Build 49's profile-inspection diagnostic proved it directly:
      # auto-fetched profile contained 8 entitlements, applesignin
      # was MISSING.
      #
      # A manually-created profile at developer.apple.com (verified
      # via direct .mobileprovision plist inspection) DOES contain
      # applesignin = ['Default']. The user uploaded that profile +
      # an Apple Distribution Certificate to Codemagic's Code Signing
      # Identities tab; we reference both by name here.
      #
      # When new App ID capabilities are added in future versions,
      # regenerate the profile at developer.apple.com and re-upload
      # to Codemagic under the same reference name — no code change
      # required here. (Auto-signing would have handled this
      # automatically but it's broken for our case.)
      ios_signing:
        provisioning_profiles:
          - awakened-app-store-manual
        certificates:
          - awakened-distribution

      # ── Build variables ────────────────────────────────────────
      vars:
        BUNDLE_ID:        "com.goallearner.awakened"
        APP_VERSION:      "2.2.2"
        XCODE_WORKSPACE:  "ios/App/App.xcworkspace"
        XCODE_SCHEME:     "App"
        # ↓ Replace with your numeric App ID from App Store Connect
        #   Find it at: appstoreconnect.apple.com → My Apps → App Information
        APP_STORE_ID:     "6764727990"

      node:      v24.15.0
      xcode:     latest
      cocoapods: default

    # ── Build steps ────────────────────────────────────────────────
    scripts:

      - name: Print build provenance (commit hash + version knobs)
        script: |
          # v3 Phase 1z.90 — make every Codemagic build log self-describing.
          # Reconciling "brand-new TestFlight build" against runtime
          # APP_BUILD_TAG requires knowing EXACTLY:
          #   - which git commit Codemagic checked out
          #   - what APP_BUILD_TAG is in the checked-out app.js
          #   - what app.js?v query string is in the checked-out index.html
          #   - what CACHE_VERSION is in the checked-out sw.js
          #   - what TestFlight build number this run will produce
          # All printed loudly so a Codemagic log inspector can instantly
          # match the in-app boot stamp to a specific IPA.
          echo "════════════════════════════════════════════════════════════"
          echo "BUILD PROVENANCE — Awakened iOS"
          echo "════════════════════════════════════════════════════════════"
          echo "Git commit:        $(git rev-parse HEAD)"
          echo "Git short:         $(git rev-parse --short HEAD)"
          echo "Git branch:        $(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '(detached)')"
          echo "Git subject:       $(git log -1 --pretty=format:'%s')"
          echo "Git author date:   $(git log -1 --pretty=format:'%ai')"
          echo "----"
          # Repo source-of-truth knobs (BEFORE cap sync)
          REPO_BUILD_TAG=$(grep -oE "APP_BUILD_TAG\s*=\s*'[^']+'" app.js | head -1 | sed -E "s/.*'([^']+)'/\1/")
          REPO_APPJS_V=$(grep -oE "app\.js\?v=[0-9]+" index.html | head -1)
          REPO_SW_CV=$(grep -oE "CACHE_VERSION\s*=\s*'[^']+'" sw.js | head -1 | sed -E "s/.*'([^']+)'/\1/")
          REPO_APP_VERSION=$(grep -oE "APP_VERSION\s*=\s*'[^']+'" app.js | head -1 | sed -E "s/.*'([^']+)'/\1/")
          echo "Repo APP_VERSION:     $REPO_APP_VERSION"
          echo "Repo APP_BUILD_TAG:   $REPO_BUILD_TAG"
          echo "Repo index.html ref:  $REPO_APPJS_V"
          echo "Repo sw.js cache:     $REPO_SW_CV"
          echo "----"
          # Fail loudly if APP_BUILD_TAG is missing entirely. Catches a
          # bad merge that wiped the constant.
          if [ -z "$REPO_BUILD_TAG" ]; then
            echo "FAIL: APP_BUILD_TAG not found in app.js — cannot proceed"
            exit 1
          fi
          # TestFlight build number this run will produce (best-effort).
          # The actual increment happens later in the pipeline; this is
          # just for the provenance log.
          LATEST_TF=$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_ID" 2>/dev/null || echo "unknown")
          echo "TestFlight latest:    $LATEST_TF"
          echo "This build will be:   $((LATEST_TF + 1)) (best-effort estimate)"
          echo "════════════════════════════════════════════════════════════"

      - name: Install Node dependencies
        script: npm install

      - name: Unit-test gate (economy math) — FAILS THE BUILD ON RED
        script: |
          set -e
          echo "── W487 unit-test gate (regression guard; runs the lib/economy tests before any bundling) ──"
          npm run test:unit

      - name: Copy PWA files into www/ for Capacitor
        script: |
          mkdir -p www
          # Path-less shell files — copy explicitly.
          cp index.html styles.css sw.js manifest.json www/
          # W487 — the JS bundle is DERIVED from index.html's <script src> graph, NOT a
          # hand-kept filename list, so any local script (incl. path-bearing files like
          # lib/economy.js) is auto-copied with its sub-path. This generalizes the W480
          # lib/economy.js one-off: the next new JS file can never be silently omitted.
          # (?v= version drift is still validated separately by the freshness gate below.)
          SCRIPTS=$(grep -oE '<script[^>]+src="[^"]+"' index.html | sed -E 's/.*src="([^"]+)".*/\1/' | sed -E 's/\?v=[0-9]+$//' | grep -vE '^https?:')
          echo "JS referenced by index.html:"; echo "$SCRIPTS"
          for js in $SCRIPTS; do
            if [ ! -f "$js" ]; then echo "FAIL: index.html references <script src=\"$js\"> but $js is missing on disk"; exit 1; fi
            mkdir -p "www/$(dirname "$js")"
            cp "$js" "www/$js"
          done
          # Class avatar silhouettes
          cp avatar-*.png www/
          # PWA app-icons (rendered from app-icon-source.png by
          # scripts/generate-app-icons.ps1; checked into the repo).
          cp icon-192.png icon-512.png www/
          # Tab-bar icons (DALL-E art) — copy only the optimized 192×192 PNGs
          # into www/. The 1254×1254 *-source.png masters stay in the repo
          # but must NOT ship in the iOS bundle (16 MB of dead weight).
          mkdir -p www/assets/tab-icons
          for icon in tab-status tab-habits tab-stats tab-history tab-dungeon tab-items tab-social; do
            cp "assets/tab-icons/$icon.png" "www/assets/tab-icons/$icon.png"
          done
          # Stat icons (DALL-E art) — same pattern as tab icons.
          mkdir -p www/assets/stat-icons
          for icon in stat-str stat-vit stat-int stat-focus stat-will stat-wlt; do
            cp "assets/stat-icons/$icon.png" "www/assets/stat-icons/$icon.png"
          done
          # Habit icons (DALL-E art) — full curated coverage. Same
          # pattern: only the optimized 192×192 PNGs ship; the 600×600
          # *-source.png masters stay out of www/.
          mkdir -p www/assets/habit-icons
          for icon in icon-water icon-sleep icon-wake icon-walk icon-cardio icon-strength icon-sunlight icon-gratitude icon-vitamins icon-meditate icon-nutrition icon-nophone icon-business icon-cold icon-connection icon-finance icon-grounding icon-journal icon-learning icon-mobility icon-noalcohol icon-nocaffeine icon-nodoomscroll icon-noscreen-bed icon-nosugar icon-protein icon-read icon-target icon-tidy icon-sprint icon-nosocial icon-priority icon-plan-tomorrow icon-screen-cap icon-podcast icon-pray icon-visualize icon-pack-morning icon-pack-lockedin icon-pack-custom icon-streak icon-xp icon-class-civilian icon-class-warrior icon-class-ranger icon-class-mage icon-class-assassin icon-class-paladin icon-class-merchant icon-class-sage icon-maxjump icon-depthjump icon-broadjump icon-bandjump icon-weightedjump; do
            cp "assets/habit-icons/$icon.png" "www/assets/habit-icons/$icon.png"
          done
          # Dungeon gate art (v2.0.2). Each rank tier gets one gate
          # PNG. E-rank exists today; D/C/B/A/S/SS land as bosses fill
          # those tiers. Add new gate filenames to the loop below.
          mkdir -p www/assets/gates
          for gate in gate-e-rank gate-d-rank gate-c-rank gate-b-rank gate-a-rank gate-s-rank; do
            cp "assets/gates/$gate.png" "www/assets/gates/$gate.png"
          done
          # Boss illustrations (CARDS.md spec preview). 1254×1254 manhwa
          # portraits ride inside the new card's art window.
          #
          # v3 Phase 1z.81 — switched from a hardcoded allowlist to a
          # glob copy (same pattern items use below). The prior loop
          # only listed the original 6 E/D bosses; the three C-rank
          # bosses shipped in 1z.65 / 1z.68 / 1z.70 (Ascendant Colossus,
          # Furnace Knight, Marathon Wraith) never made it into the IPA
          # even though their PNGs were on disk + tracked in git +
          # precached in sw.js. That was the entire root cause of the
          # "C-rank boss art blank on TestFlight" smoke-test failure.
          # Glob copy now picks up any future boss PNG automatically.
          mkdir -p www/assets/bosses
          if compgen -G "assets/bosses/*.png" > /dev/null; then
            cp assets/bosses/*.png www/assets/bosses/
            echo "Boss art copied:"
            ls -1 www/assets/bosses/
          fi
          # General-purpose UI icons (v2.0.1). Currently just the souls
          # currency icon; future utility icons (XP, drops, etc.) can
          # land here too. Distinct from habit-icons (which is now
          # de-facto habit-specific again).
          mkdir -p www/assets/icons
          for icon in souls-icon; do
            cp "assets/icons/$icon.png" "www/assets/icons/$icon.png"
          done
          # Item / equipment card art (v2.0.1 DROPS Phase 1). 1254×1254
          # DALL-E portraits, one per card in the CARDS constant. Copy
          # every PNG present — files that don't exist yet (8 of 9 at
          # launch) simply aren't copied and the renderer falls back to
          # the emoji + rarity gradient placeholder. Add cards to disk
          # as art lands; no codemagic edit required for the new ones.
          mkdir -p www/assets/items
          if compgen -G "assets/items/*.png" > /dev/null; then
            cp assets/items/*.png www/assets/items/
          fi
          # W245 — battle music loops (parity with prep-local-build.sh;
          # missing these = silent music layer on device)
          mkdir -p www/assets/audio
          if compgen -G "assets/audio/*.m4a" > /dev/null; then
            cp assets/audio/*.m4a www/assets/audio/
          fi
          # W245 — coach pose set parity (prep-local-build.sh has had this
          # since 1z.282; the fallback flow was missing it)
          mkdir -p www/assets/coach
          if compgen -G "assets/coach/*.png" > /dev/null; then
            cp assets/coach/*.png www/assets/coach/
          fi

      - name: Boot-smoke — www/ bundle completeness (W480-class guard)
        script: |
          set -e
          echo "── W487 boot-smoke: every www/index.html <script src>/<link href> JS+CSS must exist in www/ ──"
          MISSING=0
          REFS=$(grep -oE '(src|href)="[^"]+\.(js|css)(\?v=[0-9]+)?"' www/index.html | sed -E 's/.*="([^"]+)".*/\1/' | sed -E 's/\?v=[0-9]+$//' | grep -vE '^https?:')
          for r in $REFS; do
            if [ ! -f "www/$r" ]; then echo "FAIL: www/index.html references $r but www/$r is missing — would brick on device"; MISSING=1; fi
          done
          if [ "$MISSING" != "0" ]; then exit 1; fi
          echo "OK: www/ bundle complete ($(echo "$REFS" | grep -c . ) assets verified)."

      - name: Add iOS platform (runs on first build only)
        script: |
          if [ ! -d ios ]; then
            # cap add scaffolds the iOS project + runs pod install
            # internally. Pod install will FAIL with the default
            # deployment target (iOS 13.0) because
            # @capacitor-community/apple-sign-in v7.1.0 declares
            # s.ios.deployment_target = '14.0' in its podspec.
            # We tolerate the failure here — the NEXT step bumps the
            # project target to 14.0 and re-runs pod install with
            # the corrected value.
            npx cap add ios || true
          fi

      - name: Bump iOS deployment target to 14.0 (v2.1 Phase A)
        script: |
          # @capacitor-community/apple-sign-in v7.1.0 requires iOS
          # 14.0+. Capacitor 6's default for new iOS scaffolds is
          # 13.0. Without this step CocoaPods rejects the install
          # with "CapacitorCommunityAppleSignIn required a higher
          # minimum deployment target." See BACKEND.md §4.
          #
          # iOS 14 reached ~95% device adoption by mid-2026. Safe
          # cutoff. Idempotent — sed is a no-op once the project is
          # already at 14.0, so this step is safe to run on every
          # build (including cached-ios incremental builds).
          if [ -f ios/App/Podfile ]; then
            sed -i.bak "s/platform :ios, '13.0'/platform :ios, '14.0'/" ios/App/Podfile
            rm -f ios/App/Podfile.bak
            echo "Podfile platform line:"
            grep "platform :ios" ios/App/Podfile
          fi
          if [ -f ios/App/App.xcodeproj/project.pbxproj ]; then
            sed -i.bak "s/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g" ios/App/App.xcodeproj/project.pbxproj
            rm -f ios/App/App.xcodeproj/project.pbxproj.bak
            echo "project.pbxproj deployment target occurrences:"
            grep -c "IPHONEOS_DEPLOYMENT_TARGET = 14.0" ios/App/App.xcodeproj/project.pbxproj
          fi
          # Re-run pod install with the corrected target. Earlier
          # cap add (above) likely failed at pod install; this is
          # the recovery. cd into the App subdir because that's
          # where the Podfile lives.
          cd ios/App && pod install

      - name: Verify www/ bundle freshness (pre-sync gate)
        script: |
          # Fail the build LOUDLY if the www/ snapshot doesn't contain
          # the markers we expect. Protects against (a) the copy step
          # silently skipping a file, (b) codemagic running on a stale
          # checkout, (c) a typo in the copy command pattern.
          #
          # Stable markers checked:
          #   - "social-friends-body"  → Social tab Friends section markup landed
          #
          # v3 Phase 1z.279 — Duels permanently retired. Removed all
          # duel-specific freshness gates (renderDuelsSection,
          # renderActiveDuelHero, DUEL_TYPES, duel-type-overlay,
          # submitActiveStepsDuelProgress, submitDuelProgress,
          # submitVerifiedEventsForDuels, cancelDuel,
          # DUEL_VERB_BY_TYPE, outanchored, duels-page-header,
          # social-duels-body). The outbox-drain marker
          # (_drainVerifiedEventOutbox, hb_verified_event_outbox)
          # is preserved because the outbox path survives the
          # retirement for legacy queue flushing.
          set -e
          echo "── www/ freshness check ──"
          if ! grep -q "social-friends-body" www/index.html; then
            echo "FAIL: www/index.html missing #social-friends-body markup"
            head -20 www/index.html
            exit 1
          fi
          if ! grep -q "renderFriendsSection" www/app.js; then
            echo "FAIL: www/app.js missing renderFriendsSection function"
            echo "      (app.js is stale relative to index.html)"
            exit 1
          fi
          if ! grep -q "fetchFriends" www/auth.js; then
            echo "FAIL: www/auth.js missing fetchFriends helper"
            echo "      (auth.js is stale relative to index.html)"
            exit 1
          fi
          if ! grep -q "getStepsBetween" www/app.js; then
            echo "FAIL: www/app.js missing Health.getStepsBetween"
            exit 1
          fi
          if ! grep -q "getSleepBetween" www/app.js; then
            echo "FAIL: www/app.js missing Health.getSleepBetween"
            exit 1
          fi
          if ! grep -q "getStrengthWorkoutsBetween" www/app.js; then
            echo "FAIL: www/app.js missing Health.getStrengthWorkoutsBetween"
            exit 1
          fi
          if ! grep -q "submitVerifiedEvents" www/auth.js; then
            echo "FAIL: www/auth.js missing submitVerifiedEvents (legacy outbox drain target)"
            exit 1
          fi
          # v3 Phase 1z.1 — Verified-event outbox drain path (preserved
          # by 1z.279 for legacy queue flushing on upgraded devices).
          if ! grep -q "_drainVerifiedEventOutbox" www/app.js; then
            echo "FAIL: www/app.js missing _drainVerifiedEventOutbox (Phase 1z.1 outbox)"
            exit 1
          fi
          if ! grep -q "hb_verified_event_outbox" www/app.js; then
            echo "FAIL: www/app.js missing hb_verified_event_outbox key (Phase 1z.1 outbox)"
            exit 1
          fi
          if ! grep -q "\-\-ease-cinema" www/styles.css; then
            echo "FAIL: www/styles.css missing --ease-cinema token (Phase 1z.2 tokens)"
            exit 1
          fi
          # v3 Phase 1z.9 — Compact 2X XP buff pill replacing full-width banner.
          if ! grep -q "aw-buff-pill--xp2x" www/index.html; then
            echo "FAIL: www/index.html missing aw-buff-pill--xp2x (Phase 1z.9 pill markup)"
            exit 1
          fi
          if ! grep -q "aw-buff-pill" www/styles.css; then
            echo "FAIL: www/styles.css missing .aw-buff-pill block (Phase 1z.9 pill CSS)"
            exit 1
          fi
          # v3 Phase 1z.6 — boss-defeat result modal must be present.
          if ! grep -q "boss-result-overlay" www/index.html; then
            echo "FAIL: www/index.html missing #boss-result-overlay (Phase 1z.6)"
            exit 1
          fi
          if ! grep -q "_queueBossResult" www/app.js; then
            echo "FAIL: www/app.js missing _queueBossResult (Phase 1z.6)"
            exit 1
          fi
          # v3 Phase 1z.7 — Boss Defeated design pass surfaces.
          if ! grep -q "hb_boss_result_pending" www/app.js; then
            echo "FAIL: www/app.js missing hb_boss_result_pending (Phase 1z.7)"
            exit 1
          fi
          if ! grep -q "_isRelicNew" www/app.js; then
            echo "FAIL: www/app.js missing _isRelicNew (Phase 1z.7)"
            exit 1
          fi
          if ! grep -q "bro-overlay-title" www/styles.css; then
            echo "FAIL: www/styles.css missing .bro-overlay-title (Phase 1z.7)"
            exit 1
          fi
          # v3 Phase 1z.8 — yesterday-backfill helpers must reach www/.
          if ! grep -q "_markHistoricalAutoVerify" www/app.js; then
            echo "FAIL: www/app.js missing _markHistoricalAutoVerify (Phase 1z.8 backfill)"
            exit 1
          fi
          if ! grep -q "_backfillStrengthYesterday" www/app.js; then
            echo "FAIL: www/app.js missing _backfillStrengthYesterday (Phase 1z.8 backfill)"
            exit 1
          fi
          # v3 Phase 1z.12 — Direction B Premium Character Sheet markup.
          # These four sentinels prove the Status card rebuild + header
          # rune polish reached www/. A future inadvertent sed against
          # renderStatus() or the header would be caught here instead of
          # silently shipping a regressed Status tab to TestFlight.
          if ! grep -q "sc-card--profile" www/app.js; then
            echo "FAIL: www/app.js missing sc-card--profile (Phase 1z.12 Status card)"
            exit 1
          fi
          if ! grep -q "sc-banner__title" www/app.js; then
            echo "FAIL: www/app.js missing sc-banner__title (Phase 1z.12 Hunter Profile banner)"
            exit 1
          fi
          if ! grep -q "sc-portrait-frame" www/styles.css; then
            echo "FAIL: www/styles.css missing .sc-portrait-frame (Phase 1z.12 portrait zone)"
            exit 1
          fi
          if ! grep -q "aw-header__rune" www/index.html; then
            echo "FAIL: www/index.html missing .aw-header__rune (Phase 1z.12 header polish)"
            exit 1
          fi
          # Compare app.js / styles.css / auth.js / sw.js version
          # strings between repo-root index.html and www/index.html.
          # Any mismatch means www/ is stale.
          for asset in app.js styles.css auth.js sw.js simulated-leaderboard.js; do
            repo_ver=$(grep -oE "${asset}\?v=[0-9]+" index.html | head -1 || true)
            www_ver=$(grep -oE "${asset}\?v=[0-9]+" www/index.html | head -1 || true)
            if [ "$repo_ver" != "$www_ver" ]; then
              echo "FAIL: $asset query string drift (repo='$repo_ver' www='$www_ver')"
              exit 1
            fi
          done
          # sw.js cache version sanity
          repo_cv=$(grep -oE "CACHE_VERSION = '[^']+'" sw.js | head -1)
          www_cv=$(grep -oE "CACHE_VERSION = '[^']+'" www/sw.js | head -1)
          if [ "$repo_cv" != "$www_cv" ]; then
            echo "FAIL: sw.js CACHE_VERSION drift (repo=$repo_cv www=$www_cv)"
            exit 1
          fi
          # v3 Phase 1z.90 — APP_BUILD_TAG sanity. Catches the case
          # where app.js made it into www/ but a stale copy lacks the
          # build-tag constant (or a merge regressed the constant).
          repo_tag=$(grep -oE "APP_BUILD_TAG\s*=\s*'[^']+'" app.js | head -1)
          www_tag=$(grep -oE "APP_BUILD_TAG\s*=\s*'[^']+'" www/app.js | head -1)
          if [ -z "$repo_tag" ] || [ -z "$www_tag" ]; then
            echo "FAIL: APP_BUILD_TAG missing (repo='$repo_tag' www='$www_tag')"
            exit 1
          fi
          if [ "$repo_tag" != "$www_tag" ]; then
            echo "FAIL: APP_BUILD_TAG drift (repo=$repo_tag www=$www_tag)"
            exit 1
          fi
          echo "  APP_BUILD_TAG:       $repo_tag"
          # v3 Phase 1z.81 — C-rank boss art must be in www/. The prior
          # boss-art copy loop was a hardcoded allowlist of 6 files
          # that didn't include the C-rank bosses shipped in 1z.65,
          # 1z.68, 1z.70. The IPA shipped without the new PNGs even
          # though the JS referenced them. Now using glob copy +
          # explicit presence check so any future regression fails
          # loudly here instead of silently shipping blank boss cards.
          for boss in the-ascendant-colossus the-furnace-knight the-marathon-wraith; do
            if [ ! -f "www/assets/bosses/$boss.png" ]; then
              echo "FAIL: www/assets/bosses/$boss.png missing — Codemagic boss-art copy regressed"
              echo "      The hardcoded allowlist on line ~117 of codemagic.yaml has likely been re-introduced."
              ls -la www/assets/bosses/ || true
              exit 1
            fi
          done
          echo "✓ www/ bundle verified fresh"
          echo "  index.html size:    $(wc -c < www/index.html) bytes"
          echo "  app.js size:        $(wc -c < www/app.js) bytes"
          echo "  auth.js size:       $(wc -c < www/auth.js) bytes"
          echo "  styles.css size:    $(wc -c < www/styles.css) bytes"
          echo "  sw.js CACHE_VERSION: $www_cv"
          echo "  boss art count:     $(ls www/assets/bosses/ | wc -l) PNGs"

      - name: Force-clean Capacitor iOS public dir before sync
        script: |
          # Capacitor 'cap copy' overwrites files but does NOT remove
          # files that have been deleted from www/. More importantly,
          # if a previous build cached ios/App/App/public/ with a stale
          # bundle, cap sync's incremental copy could fail to replace
          # certain entries on some platforms. Wipe explicitly so the
          # sync lands on a guaranteed-clean slate every build.
          if [ -d ios/App/App/public ]; then
            echo "Wiping ios/App/App/public/* before cap sync…"
            rm -rf ios/App/App/public/*
          else
            echo "ios/App/App/public/ does not exist yet — cap sync will create it"
          fi

      - name: Sync web assets into iOS project
        script: npx cap sync ios

      - name: Verify iOS public bundle freshness (post-sync gate)
        script: |
          # Cross-check that cap sync actually propagated www/ →
          # ios/App/App/public/. If this step fails, the IPA would
          # bundle stale assets and TestFlight users see old UI.
          set -e
          PUB="ios/App/App/public"
          if [ ! -f "$PUB/index.html" ]; then
            echo "FAIL: $PUB/index.html missing after cap sync"
            ls -la "$PUB" || true
            exit 1
          fi
          if ! grep -q "social-friends-body" "$PUB/index.html"; then
            echo "FAIL: $PUB/index.html missing #social-friends-body after sync"
            echo "      cap sync did not propagate the new index.html"
            head -20 "$PUB/index.html"
            exit 1
          fi
          # v3 Phase 1z.279 — Duels permanently retired. All duel-
          # specific iOS-bundle freshness gates removed.
          # Preserved: HealthKit helper gates (still needed by boss
          # auto-verify) and the outbox-drain gates (legacy queue
          # flush path).
          if ! grep -q "getStepsBetween" "$PUB/app.js"; then
            echo "FAIL: $PUB/app.js missing Health.getStepsBetween"
            exit 1
          fi
          if ! grep -q "getSleepBetween" "$PUB/app.js"; then
            echo "FAIL: $PUB/app.js missing Health.getSleepBetween"
            exit 1
          fi
          if ! grep -q "getStrengthWorkoutsBetween" "$PUB/app.js"; then
            echo "FAIL: $PUB/app.js missing Health.getStrengthWorkoutsBetween"
            exit 1
          fi
          if ! grep -q "submitVerifiedEvents" "$PUB/auth.js"; then
            echo "FAIL: $PUB/auth.js missing submitVerifiedEvents (legacy outbox drain target)"
            exit 1
          fi
          # v3 Phase 1z.1 — Verified-event outbox drain path (preserved
          # by 1z.279 for legacy queue flushing on upgraded devices).
          if ! grep -q "_drainVerifiedEventOutbox" "$PUB/app.js"; then
            echo "FAIL: $PUB/app.js missing _drainVerifiedEventOutbox (Phase 1z.1 outbox)"
            exit 1
          fi
          if ! grep -q "hb_verified_event_outbox" "$PUB/app.js"; then
            echo "FAIL: $PUB/app.js missing hb_verified_event_outbox key (Phase 1z.1 outbox)"
            exit 1
          fi
          if ! grep -q "\-\-ease-cinema" "$PUB/styles.css"; then
            echo "FAIL: $PUB/styles.css missing --ease-cinema token (Phase 1z.2 tokens)"
            exit 1
          fi
          # v3 Phase 1z.9 — Compact 2X XP buff pill must reach iOS bundle.
          if ! grep -q "aw-buff-pill--xp2x" "$PUB/index.html"; then
            echo "FAIL: $PUB/index.html missing aw-buff-pill--xp2x (Phase 1z.9 pill markup)"
            exit 1
          fi
          if ! grep -q "aw-buff-pill" "$PUB/styles.css"; then
            echo "FAIL: $PUB/styles.css missing .aw-buff-pill block (Phase 1z.9 pill CSS)"
            exit 1
          fi
          # v3 Phase 1z.6 — boss-defeat result modal must reach iOS bundle.
          if ! grep -q "boss-result-overlay" "$PUB/index.html"; then
            echo "FAIL: $PUB/index.html missing #boss-result-overlay (Phase 1z.6)"
            exit 1
          fi
          if ! grep -q "_queueBossResult" "$PUB/app.js"; then
            echo "FAIL: $PUB/app.js missing _queueBossResult (Phase 1z.6)"
            exit 1
          fi
          # v3 Phase 1z.7 — Boss Defeated design pass must reach iOS bundle.
          if ! grep -q "hb_boss_result_pending" "$PUB/app.js"; then
            echo "FAIL: $PUB/app.js missing hb_boss_result_pending (Phase 1z.7)"
            exit 1
          fi
          if ! grep -q "_isRelicNew" "$PUB/app.js"; then
            echo "FAIL: $PUB/app.js missing _isRelicNew (Phase 1z.7)"
            exit 1
          fi
          if ! grep -q "bro-overlay-title" "$PUB/styles.css"; then
            echo "FAIL: $PUB/styles.css missing .bro-overlay-title (Phase 1z.7)"
            exit 1
          fi
          # v3 Phase 1z.8 — yesterday-backfill helpers must reach iOS bundle.
          if ! grep -q "_markHistoricalAutoVerify" "$PUB/app.js"; then
            echo "FAIL: $PUB/app.js missing _markHistoricalAutoVerify (Phase 1z.8 backfill)"
            exit 1
          fi
          if ! grep -q "_backfillStrengthYesterday" "$PUB/app.js"; then
            echo "FAIL: $PUB/app.js missing _backfillStrengthYesterday (Phase 1z.8 backfill)"
            exit 1
          fi
          # v3 Phase 1z.12 — Direction B Premium Character Sheet markup
          # must reach iOS bundle. Catches the case where renderStatus()
          # silently regresses to the legacy Status template after a
          # bad merge or sed.
          if ! grep -q "sc-card--profile" "$PUB/app.js"; then
            echo "FAIL: $PUB/app.js missing sc-card--profile (Phase 1z.12 Status card)"
            exit 1
          fi
          if ! grep -q "sc-banner__title" "$PUB/app.js"; then
            echo "FAIL: $PUB/app.js missing sc-banner__title (Phase 1z.12 Hunter Profile banner)"
            exit 1
          fi
          if ! grep -q "sc-portrait-frame" "$PUB/styles.css"; then
            echo "FAIL: $PUB/styles.css missing .sc-portrait-frame (Phase 1z.12 portrait zone)"
            exit 1
          fi
          if ! grep -q "aw-header__rune" "$PUB/index.html"; then
            echo "FAIL: $PUB/index.html missing .aw-header__rune (Phase 1z.12 header polish)"
            exit 1
          fi
          # sw.js cache version cross-check
          ios_cv=$(grep -oE "CACHE_VERSION = '[^']+'" "$PUB/sw.js" | head -1)
          repo_cv=$(grep -oE "CACHE_VERSION = '[^']+'" sw.js | head -1)
          if [ "$ios_cv" != "$repo_cv" ]; then
            echo "FAIL: $PUB/sw.js CACHE_VERSION drift (ios=$ios_cv repo=$repo_cv)"
            exit 1
          fi
          # v3 Phase 1z.90 — APP_BUILD_TAG cross-check repo ↔ iOS public.
          # If cap sync dropped the wrong app.js, this is where it fails.
          ios_tag=$(grep -oE "APP_BUILD_TAG\s*=\s*'[^']+'" "$PUB/app.js" | head -1)
          repo_tag=$(grep -oE "APP_BUILD_TAG\s*=\s*'[^']+'" app.js | head -1)
          if [ -z "$ios_tag" ] || [ -z "$repo_tag" ]; then
            echo "FAIL: APP_BUILD_TAG missing post-sync (ios='$ios_tag' repo='$repo_tag')"
            exit 1
          fi
          if [ "$ios_tag" != "$repo_tag" ]; then
            echo "FAIL: APP_BUILD_TAG drift post-sync (ios=$ios_tag repo=$repo_tag)"
            exit 1
          fi
          # Also print the resolved tag from the iOS bundle so the
          # Codemagic log shows EXACTLY what will ship.
          echo "  iOS public APP_BUILD_TAG: $ios_tag"
          echo "  iOS public app.js?v ref:  $(grep -oE 'app\.js\?v=[0-9]+' "$PUB/index.html" | head -1)"
          # v3 Phase 1z.81 — confirm C-rank boss art reached the iOS
          # public dir. Mirror of the pre-sync check above; catches
          # the case where cap sync somehow drops these specific files.
          for boss in the-ascendant-colossus the-furnace-knight the-marathon-wraith; do
            if [ ! -f "$PUB/assets/bosses/$boss.png" ]; then
              echo "FAIL: $PUB/assets/bosses/$boss.png missing after cap sync"
              ls -la "$PUB/assets/bosses/" || true
              exit 1
            fi
          done
          echo "✓ iOS public bundle verified fresh"
          echo "  $PUB/index.html size: $(wc -c < $PUB/index.html) bytes"
          echo "  $PUB/sw.js CACHE_VERSION: $ios_cv"
          echo "  $PUB boss art count:  $(ls $PUB/assets/bosses/ | wc -l) PNGs"

      - name: Declare export compliance (no custom encryption)
        script: |
          # Apple requires every iOS build to declare encryption usage.
          # Awakened only uses iOS's standard HTTPS (exempt) — no custom
          # crypto. Setting this key allows TestFlight + App Store
          # auto-submission to skip the manual compliance question.
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          echo "Export compliance flag set."

      - name: Add HealthKit usage description and entitlement
        script: |
          # v1.1.4 — auto-verifies the Daily walk habit using Apple Health step
          # data. We only READ from HealthKit (never write), so only
          # NSHealthShareUsageDescription is strictly required, but we add the
          # update key as well to be safe against reviewer-tooling edge cases.
          PLIST="ios/App/App/Info.plist"
          ENTITLEMENTS="ios/App/App/App.entitlements"

          # ── Info.plist: usage descriptions ─────────────────────────────
          # Wording must match what Apple reviewers see in the permission
          # sheet. Keep it short, honest, and ties data to user value.
          SHARE_DESC="Awakened uses Apple Health to verify your habits and unlock boss battles in future versions. Your data stays on your device."
          UPDATE_DESC="Awakened only reads from Apple Health. It does not write to it."

          /usr/libexec/PlistBuddy -c "Add :NSHealthShareUsageDescription string '$SHARE_DESC'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSHealthShareUsageDescription '$SHARE_DESC'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSHealthUpdateUsageDescription string '$UPDATE_DESC'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSHealthUpdateUsageDescription '$UPDATE_DESC'" "$PLIST"

          # ── App.entitlements: HealthKit capability ─────────────────────
          # Must match the App ID's HealthKit capability in Apple Developer
          # portal. If the IPA fails to install with "Missing entitlement,"
          # confirm HealthKit is enabled on the App ID at developer.apple.com.
          #
          # ONLY write com.apple.developer.healthkit (the basic capability).
          # Do NOT write com.apple.developer.healthkit.access — that key is
          # for Verifiable Health Records (clinical / medical record access)
          # and requires separate Apple approval. Including it without
          # approval makes codesign fail with "Entitlement
          # com.apple.developer.healthkit.access requires approval from
          # Apple to include in a profile." Awakened only reads step counts,
          # which is covered by the basic capability — the .access key is
          # not needed and was a mis-paste from documentation in v1.1.4.
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.healthkit bool true" "$ENTITLEMENTS" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :com.apple.developer.healthkit true" "$ENTITLEMENTS"

          echo "HealthKit Info.plist + entitlement entries set."
          /usr/libexec/PlistBuddy -c "Print :NSHealthShareUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" "$ENTITLEMENTS"

      - name: Add Sign in with Apple entitlement
        script: |
          # v2.1 Phase A — Sign in with Apple capability. Mirrors the
          # HealthKit entitlement pattern. The Apple Developer Portal
          # must also have "Sign in with Apple" enabled on the App ID
          # (com.goallearner.awakened); if codesign rejects the build
          # with "Missing entitlement," confirm the Portal capability.
          # See BACKEND.md §4.
          ENTITLEMENTS="ios/App/App/App.entitlements"
          # The Sign in with Apple entitlement is an array of strings.
          # Apple expects either ['Default'] (normal apps) or
          # ['Default', 'authentication.services'] (services that need
          # the AS framework specifically). For Awakened we use Default.
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin array" "$ENTITLEMENTS" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin:0 string 'Default'" "$ENTITLEMENTS" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :com.apple.developer.applesignin:0 'Default'" "$ENTITLEMENTS"
          echo "Sign in with Apple entitlement set."
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin" "$ENTITLEMENTS"
          # W603/W604 — Push Notifications (APNs). aps-environment is a single
          # string; 'production' is correct for TestFlight + App Store builds
          # (the sandbox value is only for Xcode debug installs). Requires the
          # App ID to have Push Notifications enabled + the provisioning profile
          # regenerated to carry it (portal + Codemagic re-upload) — see the
          # profile note at the top of this file (lines 48-52).
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENTITLEMENTS" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENTITLEMENTS"
          echo "Push (aps-environment) entitlement set."
          /usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENTITLEMENTS"

      - name: Wire entitlements file into Xcode project
        script: |
          # v1.1.5 — bug fix for v1.1.4's silent HealthKit failure.
          # The previous step writes App.entitlements to disk, but
          # Capacitor's default Xcode project does NOT have
          # CODE_SIGN_ENTITLEMENTS set in build settings. Without it,
          # xcodebuild signs the IPA WITHOUT reading our entitlements
          # file → HealthKit entitlement silently absent → iOS rejects
          # requestAuthorization with no error visible to the user.
          # See CLAUDE.md "Common pitfalls" for the full diagnosis.
          #
          # This step uses the xcodeproj Ruby gem (preinstalled on
          # Codemagic macOS images) to set CODE_SIGN_ENTITLEMENTS on
          # both Debug and Release configs of the App target.
          cd ios/App
          ruby -e "
            require 'xcodeproj'
            project_path = 'App.xcodeproj'
            project = Xcodeproj::Project.open(project_path)
            target = project.targets.find { |t| t.name == 'App' }
            raise 'App target not found' unless target
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
              puts \"Set CODE_SIGN_ENTITLEMENTS for #{config.name}\"
            end
            project.save
            puts 'project.pbxproj saved'
          "

      - name: Install custom app icon
        script: |
          # Copy custom AppIcon.appiconset over the Capacitor default
          rm -rf ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp -R resources/ios/AppIcon.appiconset ios/App/App/Assets.xcassets/
          echo "Icon files installed:"
          ls -la ios/App/App/Assets.xcassets/AppIcon.appiconset/

      - name: Apply code signing profiles
        script: xcode-project use-profiles
        # Reads the manually-uploaded provisioning profile
        # (awakened-app-store-manual, referenced in environment.
        # ios_signing.provisioning_profiles above) from the standard
        # ~/Library/MobileDevice/Provisioning Profiles/ location
        # where Codemagic's pre-build setup placed it, and configures
        # the Xcode project to use it. With manual signing the
        # CODE_SIGN_STYLE=Manual is what the Build IPA step expects
        # (see line ~440).

      - name: Set version and auto-increment build number
        script: |
          cd ios/App
          # Set marketing version (shown in App Store)
          agvtool new-marketing-version "$APP_VERSION"
          # Auto-increment build number from latest TestFlight upload
          LATEST=$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $((LATEST + 1))

      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    # ── Artifacts to download after build ──────────────────────────
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    # ── Publishing ─────────────────────────────────────────────────
    publishing:
      app_store_connect:
        auth: integration
        # Automatically uploads every successful build to TestFlight
        submit_to_testflight: true
        # Set to true when you are ready to submit for App Store review
        submit_to_app_store: false
