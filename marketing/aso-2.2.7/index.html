<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Awakened — App Store Screenshots 2.2.7 — capture canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0a0a12; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">
(function(){
// spark-pack-shared.jsx — Tokens + Spark geometry primitives + reusable atoms.

const SK = {
  bg: '#050513',
  navy: '#0e0e2a',
  navyDeep: '#08081a',
  navyMid: '#14143a',
  navy3: '#1a1640',
  gold: '#f5b842',
  goldLight: '#f7c558',
  goldDeep: '#c08418',
  goldGlow: 'rgba(245,184,66,0.45)',
  goldGlowSoft: 'rgba(245,184,66,0.18)',
  violet: '#a78bfa',
  violetDeep: '#6d3acc',
  text: '#f5f5fa',
  text2: '#9090a8',
  text3: '#54546e',
  text4: '#1d1d2e',
  ok: '#7dd07d',
  bad: '#ef4444',
  sans: '-apple-system, "SF Pro Display", system-ui, sans-serif',
  serif: '"Cinzel", "Trajan Pro", Georgia, serif',
  mono: '"JetBrains Mono", "SF Mono", ui-monospace, monospace',
};

// ─── Spark geometry — canonical paths, viewBox 100×100 ───────────────

const SPARK_PATHS = {
  triangle:  'M50 12 L84 82 L16 82 Z',
  flame:     'M50 34 C 42 48 42 60 50 66 C 58 60 58 48 50 34 Z',
  flameSmall:'M50 38 C 44 50 44 58 50 63 C 56 58 56 50 50 38 Z',
  // Notch glyphs are short cuts placed at each vertex.
  // We render them as three separate stroke lines for crispness at small sizes.
  notches: [
    'M48 14 L52 14',  // top apex (horizontal cut)
    'M18 84 L22 80',  // bottom-left (diagonal cut)
    'M82 84 L78 80',  // bottom-right (diagonal cut)
  ],
};

const dropGold = (s, a = 0.45) => `drop-shadow(0 0 ${s*0.04}px rgba(245,184,66,${a}))`;

// ─── Squircle shell (iOS 22.37% superellipse approximation) ──────────

function Squircle({ size = 180, bg, ring = true, children, padFactor }) {
  return (
    <div style={{
      width: size, height: size,
      borderRadius: size * 0.2237,
      background: bg, overflow: 'hidden', position: 'relative',
      boxShadow: `0 12px 32px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.04)`,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      {ring && <div style={{
        position: 'absolute', inset: 0, borderRadius: 'inherit',
        boxShadow: `inset 0 0 0 1.5px rgba(245,184,66,0.22)`,
        pointerEvents: 'none',
      }}/>}
      {children}
    </div>
  );
}

// ─── The mark — drawn at the requested size, with size-aware behavior ─

// Below this size, notches are dropped (they become noise).
const NOTCH_MIN_PX = 36;
// Below this size, mark is centered inside a slightly larger safe area.
const FLAME_FILTER_MIN_PX = 40;

function SparkMark({ size = 100, fill = SK.gold, opacity = 1, notches: showNotches, glow = true }) {
  const inSqr = size; // intended SVG render size
  const drawNotches = (showNotches ?? (inSqr >= NOTCH_MIN_PX));
  const useGlow = glow && inSqr >= FLAME_FILTER_MIN_PX;
  return (
    <svg width={size} height={size} viewBox="0 0 100 100"
      style={{ filter: useGlow ? dropGold(size * 1.6, 0.4) : 'none', display: 'block' }}>
      <path d={SPARK_PATHS.triangle} fill="none" stroke={fill}
        strokeWidth={inSqr < 40 ? 4 : 3.5} strokeLinejoin="round" opacity={opacity}/>
      {drawNotches && (
        <g stroke={fill} strokeWidth="2" strokeLinecap="round" opacity={opacity * 0.95}>
          {SPARK_PATHS.notches.map((p, i) => <path key={i} d={p}/>)}
        </g>
      )}
      <path d={SPARK_PATHS.flame} fill={fill} opacity={opacity}/>
    </svg>
  );
}

// Spark-on-squircle at any size. Mark covers ~62% of icon edge.
function SparkIcon({ size = 180, variant = 'primary' }) {
  const innerRatio = 0.62;
  const innerSize = Math.round(size * innerRatio);
  if (variant === 'primary') {
    return (
      <Squircle size={size} bg={`linear-gradient(180deg, #14143a 0%, ${SK.navyDeep} 100%)`}>
        <SparkMark size={innerSize}/>
      </Squircle>
    );
  }
  if (variant === 'black') {
    return (
      <Squircle size={size} bg="#000000" ring={false}>
        <SparkMark size={innerSize} glow={size >= 60}/>
      </Squircle>
    );
  }
  if (variant === 'inverted') {
    return (
      <Squircle size={size} bg={`linear-gradient(180deg, ${SK.goldLight}, ${SK.gold} 60%, ${SK.goldDeep})`} ring={false}>
        <SparkMark size={innerSize} fill={SK.navyDeep} glow={false}/>
      </Squircle>
    );
  }
  if (variant === 'tinted') {
    return (
      <Squircle size={size} bg="#1c1c1e" ring={false}>
        <SparkMark size={innerSize} fill="rgba(255,255,255,0.92)" glow={false}/>
      </Squircle>
    );
  }
  if (variant === 'violet') {
    // Optional: the violet emphasis variant — for marketing only, not iOS icon
    return (
      <Squircle size={size} bg={`radial-gradient(circle at 50% 35%, ${SK.navy3} 0%, ${SK.navyDeep} 60%)`}>
        <SparkMark size={innerSize}/>
        <div style={{
          position: 'absolute', inset: 0, borderRadius: 'inherit',
          background: `radial-gradient(circle at 50% 80%, rgba(167,139,250,0.20), transparent 65%)`,
          pointerEvents: 'none',
        }}/>
      </Squircle>
    );
  }
  return null;
}

// Section atoms used by the pack ─────────────────────────────────────

function Kicker({ children }) {
  return (
    <div style={{
      fontFamily: SK.mono, fontSize: 10, color: SK.gold, fontWeight: 800,
      letterSpacing: 2, textTransform: 'uppercase',
    }}>{children}</div>
  );
}
function H1({ children }) {
  return (
    <div style={{
      marginTop: 4, fontFamily: SK.serif, fontSize: 26, fontWeight: 600, color: SK.gold,
      letterSpacing: 1.6, textShadow: `0 0 16px ${SK.goldGlow}`,
    }}>{children}</div>
  );
}
function H2({ children }) {
  return (
    <div style={{
      fontFamily: SK.mono, fontSize: 9.5, color: SK.gold, fontWeight: 800,
      letterSpacing: 1.4, textTransform: 'uppercase', marginBottom: 10,
    }}>{children}</div>
  );
}
function P({ children, dim }) {
  return (
    <div style={{ marginTop: 6, fontSize: 12.5, color: dim ? SK.text3 : SK.text2, lineHeight: 1.55 }}>
      {children}
    </div>
  );
}

function Card({ children, accent }) {
  return (
    <div style={{
      padding: '22px 22px 24px',
      background: accent ? `linear-gradient(180deg, #0f0f28, ${SK.navyDeep})` : SK.navyDeep,
      borderRadius: 18,
      border: `1px solid ${accent ? 'rgba(245,184,66,0.55)' : 'rgba(255,255,255,0.06)'}`,
      boxShadow: accent
        ? `0 0 0 1px rgba(245,184,66,0.20), 0 28px 60px rgba(0,0,0,0.55)`
        : `0 16px 40px rgba(0,0,0,0.45)`,
      fontFamily: SK.sans, color: SK.text,
    }}>{children}</div>
  );
}

function SpecRow({ k, v }) {
  return (
    <div style={{
      display: 'grid', gridTemplateColumns: '110px 1fr', gap: 10,
      paddingTop: 10, marginTop: 10, borderTop: `1px solid rgba(255,255,255,0.05)`,
      fontSize: 11.5, lineHeight: 1.5,
    }}>
      <div style={{ fontFamily: SK.mono, color: SK.gold, fontSize: 9.5, fontWeight: 800, letterSpacing: 1.2, paddingTop: 1 }}>{k}</div>
      <div style={{ color: SK.text }}>{v}</div>
    </div>
  );
}

function BulletBlock({ title, tone = 'ok', children }) {
  const palette = {
    ok:     { bar: SK.gold, bg: 'rgba(245,184,66,0.06)',  label: SK.gold },
    info:   { bar: SK.violet, bg: 'rgba(167,139,250,0.06)', label: SK.violet },
    bad:    { bar: SK.bad, bg: 'rgba(239,68,68,0.06)',    label: SK.bad },
  }[tone];
  return (
    <div style={{
      marginTop: 12, padding: '10px 12px 12px',
      background: palette.bg, borderLeft: `2px solid ${palette.bar}`, borderRadius: 4,
    }}>
      <div style={{ fontFamily: SK.mono, fontSize: 9.5, color: palette.label, fontWeight: 800, letterSpacing: 1.4 }}>{title}</div>
      <ul style={{ margin: '6px 0 0', paddingLeft: 16, fontSize: 11.5, color: SK.text2, lineHeight: 1.6 }}>
        {children}
      </ul>
    </div>
  );
}

// Bare transparent mark — for splash, loaders, in-app sigils
function SparkBareMark({ size = 60, fill = SK.gold, glow = true }) {
  return (
    <SparkMark size={size} fill={fill} glow={glow}/>
  );
}

Object.assign(window, {
  SK, SPARK_PATHS, dropGold,
  Squircle, SparkMark, SparkIcon, SparkBareMark,
  Kicker, H1, H2, P, Card, SpecRow, BulletBlock,
});

})();
</script>
<script type="text/babel" data-presets="react">
(function(){
// fa-shared.jsx — The First Awakened · shared tokens, character pose slot,
// sigil + section glyphs, device frame, typewriter hook, speech-card atoms.
// Palette + type lifted directly from the live Awakened app (System Full 1z.280).
// Self-contained — depends only on React. Names are FA-prefixed to avoid
// collision with system-full-shared.jsx tokens.

const FA = {
  bgDeep: '#050513',
  bg: '#08081a',
  sheet: '#100f28',
  sheetGlass: 'linear-gradient(180deg, #16142f 0%, #0d0c22 100%)',
  panel: 'linear-gradient(180deg, rgba(28,22,54,0.97) 0%, rgba(11,9,28,0.98) 100%)',
  card: 'linear-gradient(180deg, #16163a 0%, #0e0e26 100%)',
  border: 'rgba(255,255,255,0.08)',
  borderSoft: 'rgba(255,255,255,0.06)',

  gold: '#f5b842',
  gold2: '#ecca84',
  goldDeep: '#c08418',
  goldGlow: 'rgba(245,184,66,0.30)',

  violet: '#8b5cf6',
  violetB: '#a78bfa',
  violetGlow: 'rgba(139,92,246,0.34)',

  green: '#34d399',
  red: '#ef4444',

  text: '#f4f3fb',
  text2: '#9aa0bd',
  text3: '#5c5c78',

  sans: '-apple-system, "SF Pro Display", system-ui, sans-serif',
  mono: '"JetBrains Mono", "SF Mono", ui-monospace, monospace',
  serif: '"Cinzel", "Trajan Pro", Georgia, serif',
};

const FA_STAT = { STR:'#ef4444', VIT:'#34d399', INT:'#3b82f6', FOCUS:'#eab308', WILL:'#f97316', WLT:'#f5b842' };

const FA_PREFERS_REDUCED = (typeof window !== 'undefined' && window.matchMedia)
  ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;

// ─── Character pose slot ──────────────────────────────────────────────
// Renders the real PNG from assets/coach/first-awakened-{pose}.png when it
// exists; otherwise falls back to a ghosted on-brand placeholder so the
// composition + spec read in preview. The five poses ship separately
// (see brief). DO NOT redesign the character — this is only a slot.
const FA_POSES = ['idle', 'pointing', 'speaking', 'nodding', 'scroll'];

function CoachFigure({ pose = 'idle', size = 160, glow = true, showFilename = true }) {
  const [missing, setMissing] = React.useState(false);
  const w = size * 0.78;
  return (
    <div style={{
      position: 'relative', width: w, height: size,
      display: 'flex', alignItems: 'flex-end', justifyContent: 'center',
    }}>
      {/* violet aura — part of OUR treatment, sits behind the figure */}
      {glow && (
        <div style={{
          position: 'absolute', left: '50%', top: '46%', transform: 'translate(-50%,-50%)',
          width: size * 0.92, height: size * 0.92, borderRadius: '50%',
          background: `radial-gradient(circle, ${FA.violetGlow} 0%, rgba(139,92,246,0.10) 42%, transparent 70%)`,
          filter: 'blur(2px)', pointerEvents: 'none',
        }}/>
      )}
      {/* real art (auto-shows if present) */}
      <img
        src={`assets/coach/first-awakened-${pose}.png`}
        alt={`The First Awakened — ${pose} pose`}
        onError={() => setMissing(true)}
        style={{
          position: 'relative', height: '100%', width: 'auto', maxWidth: '100%',
          objectFit: 'contain', display: missing ? 'none' : 'block',
          filter: `drop-shadow(0 6px 18px rgba(0,0,0,0.55))`,
        }}
      />
      {missing && <CoachPlaceholder pose={pose} size={size} showFilename={showFilename}/>}
    </div>
  );
}

// Ghosted robed-figure placeholder — simple shapes only (triangle robe,
// circle head, staff line). Obviously a stand-in, never mistaken for art.
function CoachPlaceholder({ pose, size, showFilename }) {
  return (
    <div style={{
      position: 'relative', width: size * 0.72, height: size,
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-end',
    }}>
      <svg viewBox="0 0 100 130" width={size * 0.72} height={size} style={{ display: 'block' }}>
        <defs>
          <linearGradient id={`fa-robe-${pose}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="rgba(167,139,250,0.30)"/>
            <stop offset="100%" stopColor="rgba(139,92,246,0.07)"/>
          </linearGradient>
          <pattern id={`fa-stripe-${pose}`} width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
            <rect width="7" height="7" fill="transparent"/>
            <line x1="0" y1="0" x2="0" y2="7" stroke="rgba(167,139,250,0.16)" strokeWidth="2.4"/>
          </pattern>
        </defs>
        {/* robe */}
        <path d="M50 34 L78 122 L22 122 Z" fill={`url(#fa-robe-${pose})`} stroke="rgba(167,139,250,0.5)" strokeWidth="1.2"/>
        <path d="M50 34 L78 122 L22 122 Z" fill={`url(#fa-stripe-${pose})`}/>
        {/* gold trim hem */}
        <line x1="24" y1="118" x2="76" y2="118" stroke={FA.gold} strokeWidth="1.4" opacity="0.55"/>
        {/* head */}
        <circle cx="50" cy="22" r="13" fill="rgba(167,139,250,0.16)" stroke="rgba(167,139,250,0.55)" strokeWidth="1.2"/>
        {/* staff — orientation hints the pose */}
        <line
          x1={pose === 'pointing' ? 70 : 78} y1={pose === 'pointing' ? 50 : 18}
          x2={pose === 'pointing' ? 92 : 78} y2={pose === 'pointing' ? 40 : 126}
          stroke="rgba(245,184,66,0.5)" strokeWidth="1.6" strokeLinecap="round"/>
        <circle cx={pose === 'pointing' ? 92 : 78} cy={pose === 'pointing' ? 40 : 16} r="3.4" fill={FA.gold} opacity="0.7"/>
      </svg>
      {showFilename && (
        <div style={{
          position: 'absolute', bottom: -2, left: '50%', transform: 'translateX(-50%)',
          fontFamily: FA.mono, fontSize: 7.5, letterSpacing: 0.4, whiteSpace: 'nowrap',
          color: FA.text3, background: 'rgba(5,5,19,0.7)', padding: '2px 6px', borderRadius: 4,
          border: `1px solid ${FA.borderSoft}`,
        }}>coach/{pose}.png</div>
      )}
    </div>
  );
}

// ─── Sigils & section glyphs (vow-sigil family) ──────────────────────
function VowSigil({ size = 56, tone = 'violet' }) {
  const ring = tone === 'gold' ? FA.gold : FA.violetB;
  const glow = tone === 'gold' ? FA.goldGlow : FA.violetGlow;
  return (
    <div style={{ width: size, height: size, display: 'flex', alignItems: 'center', justifyContent: 'center', filter: `drop-shadow(0 0 14px ${glow})` }}>
      <svg width={size} height={size} viewBox="0 0 56 56" fill="none">
        <defs>
          <linearGradient id={`fa-core-${tone}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={FA.gold2}/><stop offset="100%" stopColor={FA.goldDeep}/>
          </linearGradient>
        </defs>
        <path d="M28 3 L53 28 L28 53 L3 28 Z" stroke={ring} strokeWidth="1.4" fill="rgba(139,92,246,0.06)"/>
        <path d="M28 12 L44 28 L28 44 L12 28 Z" stroke={ring} strokeWidth="0.8" opacity="0.6" fill="none"/>
        <path d="M28 3 L28 12 M28 44 L28 53 M3 28 L12 28 M44 28 L53 28" stroke={ring} strokeWidth="0.7" opacity="0.5"/>
        <path d="M28 19 L37 28 L28 37 L19 28 Z" fill={`url(#fa-core-${tone})`} opacity="0.95"/>
      </svg>
    </div>
  );
}

function MiniDiamond({ size = 9, color = '#a78bfa' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 10 10" style={{ display: 'block' }}>
      <path d="M5 0.5 L9.5 5 L5 9.5 L0.5 5 Z" fill="none" stroke={color} strokeWidth="1"/>
      <path d="M5 3 L7 5 L5 7 L3 5 Z" fill={color}/>
    </svg>
  );
}

// 7 section glyphs — geometric, 28px, gold stroke, on-brand with vow sigil.
function SectionGlyph({ name, size = 28, color = FA.gold }) {
  const s = { width: size, height: size, display: 'block' };
  const sw = 1.4;
  switch (name) {
    case 'vows': // sealed diamond
      return (<svg viewBox="0 0 32 32" style={s} fill="none"><path d="M16 3 L29 16 L16 29 L3 16 Z" stroke={color} strokeWidth={sw}/><path d="M16 10 L22 16 L16 22 L10 16 Z" stroke={color} strokeWidth={sw} opacity="0.7"/><rect x="12" y="14.7" width="8" height="2.6" rx="1.3" fill={color}/></svg>);
    case 'rank': // ascending bars inside frame
      return (<svg viewBox="0 0 32 32" style={s} fill="none"><path d="M16 3 L29 16 L16 29 L3 16 Z" stroke={color} strokeWidth={sw} opacity="0.5"/><rect x="11" y="18" width="3" height="5" fill={color}/><rect x="15" y="14" width="3" height="9" fill={color}/><rect x="19" y="10" width="3" height="13" fill={color}/></svg>);
    case 'stats': // hexagon (6 stats)
      return (<svg viewBox="0 0 32 32" style={s} fill="none"><path d="M16 3 L27 9.5 L27 22.5 L16 29 L5 22.5 L5 9.5 Z" stroke={color} strokeWidth={sw}/><path d="M16 10 L21.5 13 L21.5 19 L16 22 L10.5 19 L10.5 13 Z" stroke={color} strokeWidth={sw} opacity="0.6"/></svg>);
    case 'bosses': // diamond pierced
      return (<svg viewBox="0 0 32 32" style={s} fill="none"><path d="M16 3 L29 16 L16 29 L3 16 Z" stroke={color} strokeWidth={sw}/><circle cx="16" cy="16" r="4" fill={color}/><path d="M16 3 L16 12 M16 20 L16 29" stroke={color} strokeWidth={sw}/></svg>);
    case 'relics': // gem / crystal
      return (<svg viewBox="0 0 32 32" style={s} fill="none"><path d="M9 11 L16 4 L23 11 L16 28 Z" stroke={color} strokeWidth={sw}/><path d="M9 11 L23 11 M16 4 L16 28 M12.5 11 L16 28 M19.5 11 L16 28" stroke={color} strokeWidth={sw} opacity="0.55"/></svg>);
    case 'guild': // interlocking diamonds
      return (<svg viewBox="0 0 32 32" style={s} fill="none"><path d="M12 5 L21 14 L12 23 L3 14 Z" stroke={color} strokeWidth={sw} opacity="0.85"/><path d="M20 9 L29 18 L20 27 L11 18 Z" stroke={color} strokeWidth={sw}/></svg>);
    case 'rule': // single point in diamond — the eye / the law
      return (<svg viewBox="0 0 32 32" style={s} fill="none"><path d="M16 3 L29 16 L16 29 L3 16 Z" stroke={color} strokeWidth={sw}/><circle cx="16" cy="16" r="3" fill={color}/></svg>);
    default:
      return <MiniDiamond size={size} color={color}/>;
  }
}

// ─── Typewriter hook ──────────────────────────────────────────────────
// Reveals `text` char-by-char while `active`. Tap → if mid-line, complete;
// honors reduced-motion (instant). Full text always available for SR.
function useTypewriter(text, { speed = 28, active = true } = {}) {
  const instant = FA_PREFERS_REDUCED;
  const [n, setN] = React.useState(instant ? text.length : 0);
  const ref = React.useRef();
  React.useEffect(() => {
    setN(instant ? text.length : 0);
    if (instant || !active) { setN(text.length); return; }
    let i = 0;
    ref.current = setInterval(() => {
      i += 1; setN(i);
      if (i >= text.length) clearInterval(ref.current);
    }, speed);
    return () => clearInterval(ref.current);
  }, [text, active, speed, instant]);
  const done = n >= text.length;
  const skip = () => { clearInterval(ref.current); setN(text.length); };
  return { shown: text.slice(0, n), done, skip, full: text };
}

// ─── Gold CTA (matches System Full PrimaryCTA) ────────────────────────
function GoldCTA({ children, onClick, height = 50 }) {
  return (
    <button onClick={onClick} aria-label={typeof children === 'string' ? children : undefined} style={{
      width: '100%', height, border: 0, borderRadius: 14, cursor: 'pointer',
      fontFamily: FA.sans, fontSize: 15, fontWeight: 800, letterSpacing: 1.2,
      color: '#1b1405', background: 'linear-gradient(180deg, #f7c65c, #e3a52f)',
      boxShadow: `0 0 22px ${FA.goldGlow}, inset 0 1px 0 rgba(255,255,255,0.4)`,
      display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
      transition: 'transform .12s',
    }}
    onPointerDown={e=>e.currentTarget.style.transform='scale(0.97)'}
    onPointerUp={e=>e.currentTarget.style.transform='scale(1)'}
    onPointerLeave={e=>e.currentTarget.style.transform='scale(1)'}
    >{children}</button>
  );
}

// ─── Corner brackets (reused on coachmark + cover) ────────────────────
function CornerBrackets({ inset = 12, len = 16, color = FA.gold, opacity = 0.7 }) {
  return [['top','left'],['top','right'],['bottom','left'],['bottom','right']].map(([v,h],i)=>(
    <div key={i} style={{
      position:'absolute', [v]:inset, [h]:inset, width:len, height:len, pointerEvents:'none',
      [`border${v[0].toUpperCase()+v.slice(1)}`]:`1.5px solid ${color}`,
      [`border${h[0].toUpperCase()+h.slice(1)}`]:`1.5px solid ${color}`,
      opacity,
      borderRadius: v==='top'&&h==='left'?'4px 0 0 0': v==='top'&&h==='right'?'0 4px 0 0': v==='bottom'&&h==='left'?'0 0 0 4px':'0 0 4px 0',
    }}/>
  ));
}

Object.assign(window, {

// ─── Portrait medallion — arched gilded frame, rank-tier halo ────────
function PortraitMedallion({ rank = 'C', className = 'Paladin', size = 360, showNote = false }) {

// ─── Corner sigil ornament for the card frame ────────────────────────
function CornerSigil({ pos = 'tl', size = 34 }) {
  const map = {
    tl: { top: 0, left: 0, rot: 0 },
    tr: { top: 0, right: 0, rot: 90 },
    br: { bottom: 0, right: 0, rot: 180 },
    bl: { bottom: 0, left: 0, rot: 270 },

  const p = map[pos];
  const { rot, ...anchor } = p;
  return (
    <svg width={size} height={size} viewBox="0 0 34 34"
      style={{ position: 'absolute', ...anchor, transform: `rotate(${rot}deg)`, pointerEvents: 'none' }}>
      <path d="M2 14 L2 2 L14 2" fill="none" stroke={SC.gold} strokeWidth="1.4" opacity="0.7" />

  );
}

function FlameGlyph({ size = 44, color = SC.gold }) {

    </svg>

}

Object.assign(window, {
  SC, SC_RANKS, SC_RANK_ORDER, SC_CLASSES, SC_QUOTES, SC_EXAMPLE, fmt,
  ClassSilhouette, PortraitMedallion, RankCrest, GoldRule, CornerSigil, StatCell, FlameGlyph,

<script type="text/babel" data-presets="react">
(function(){
// as227-chrome.jsx — App Store screenshot chrome, v2.2.7.
// 1320×2868 (6.9"). Marketing background bloom + Cinzel headline + titanium
// iPhone frame. Self-contained tokens (AS-prefixed) so no library collisions.

const AS = {
  bg: '#04040d',
  gold: '#f5b842',
  goldLight: '#f7c558',
  ivory: '#f5f3fb',
  serif: '"Cinzel", "Trajan Pro", Georgia, serif',

};

// Native App Store canvas — current 6.9" required baseline.
const AS_CANVAS = { w: 1320, h: 2868 };

// Logical app-screen size every shot's children are built at.
const AS_LW = 390, AS_LH = 844;

// ─── Marketing background (full-bleed) ───────────────────────────────
// hue: accent bloom behind the headline. floor: gold glow under device.
function ASBackground({ hue = 'rgba(167,139,250,0.30)', hue2, floor = 'rgba(245,184,66,0.10)' }) {
  const bloom = hue2
    ? `radial-gradient(52% 60% at 38% 26%, ${hue} 0%, transparent 62%), radial-gradient(52% 60% at 64% 30%, ${hue2} 0%, transparent 62%)`
    : `radial-gradient(60% 70% at 50% 28%, ${hue} 0%, transparent 64%)`;
  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', background: `linear-gradient(180deg, #0b0b20 0%, ${AS.bg} 56%, #020207 100%)` }}>
      <div style={{ position: 'absolute', top: '-7%', left: '50%', transform: 'translateX(-50%)', width: '128%', height: '48%', background: bloom, filter: 'blur(10px)' }} />
      <div style={{ position: 'absolute', bottom: '-5%', left: '50%', transform: 'translateX(-50%)', width: '120%', height: '36%', background: `radial-gradient(60% 80% at 50% 82%, ${floor} 0%, transparent 62%)` }} />

      <div style={{ position: 'absolute', inset: 0, boxShadow: 'inset 0 0 420px rgba(0,0,0,0.72)' }} />
    </div>
  );
}

// ─── Titanium iPhone frame ───────────────────────────────────────────
// children must be a single AS_LW×AS_LH node.
function ASPhone({ screenW = 1030, children, glowHue = 'rgba(167,139,250,0.45)' }) {
  const sw = screenW;
  const sh = Math.round(sw / AS_LW * AS_LH);
  const bezel = Math.round(sw * 0.028);
  const radius = Math.round(sw * 0.135);
  const scale = sw / AS_LW;
  return (
    <div style={{ position: 'relative', width: sw + bezel * 2, height: sh + bezel * 2, flex: '0 0 auto' }}>
      <div style={{ position: 'absolute', inset: -sw * 0.07, borderRadius: radius * 1.3, background: `radial-gradient(closest-side, ${glowHue} 0%, transparent 78%)`, filter: 'blur(12px)' }} />
      <div style={{
        position: 'relative', width: '100%', height: '100%', borderRadius: radius + bezel,
        background: 'linear-gradient(145deg, #3c3c46 0%, #16161c 18%, #0c0c11 50%, #1d1d23 82%, #3c3c46 100%)',

        <svg width="26" height="12" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.5" fill="none"/><rect x="2" y="2" width="19" height="9" rx="2" fill={c}/><path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c}/></svg>
      </span>
    </div>
  );
}

// ─── The App Store shot template ─────────────────────────────────────
// kicker + Cinzel headline up top; titanium device below, bleeding off bottom.
function ASShot({ kicker, headline, hue, hue2, floorHue, glowHue, children, scale = 0.3, screenW = 1030, deviceTop = 760 }) {
  const { w, h } = AS_CANVAS;
  return (
    <div style={{ width: w * scale, height: h * scale, flex: '0 0 auto' }}>
      <div style={{ width: w, height: h, transform: `scale(${scale})`, transformOrigin: 'top left', position: 'relative', overflow: 'hidden', fontFamily: AS.sans }}>
        <ASBackground hue={hue} hue2={hue2} floor={floorHue} />
        <div style={{ position: 'absolute', top: 0, left: 0, right: 0, padding: '186px 132px 0', textAlign: 'center', zIndex: 2 }}>
          {kicker && (
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 22, marginBottom: 32 }}>

            {headline}

          <ASPhone screenW={screenW} glowHue={glowHue || hue}>
            {children}
          </ASPhone>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { AS, AS_CANVAS, AS_LW, AS_LH, ASBackground, ASPhone, ASStatusBar, ASShot });

})();
</script>

// ── six-stat hexagon radar ───────────────────────────────────────────
function RadarHex({ size = 150 }) {
  const cx = size/2, cy = size/2, R = size*0.40;
  // order clockwise from top: STR, VIT, INT, FOCUS, WILL, WLT
  const keys = ['STR','VIT','INT','FOCUS','WILL','WLT'];
  const lv =   { STR:9, VIT:9, INT:7, FOCUS:9, WILL:10, WLT:7 };
  const cap = 12;
  const ang = i => (i*60 - 90) * Math.PI/180;
  const pt = (r,i) => [cx + r*Math.cos(ang(i)), cy + r*Math.sin(ang(i))];
  const ring = r => keys.map((_,i) => { const [x,y]=pt(r,i); return `${i?'L':'M'}${x.toFixed(1)} ${y.toFixed(1)}`; }).join(' ')+' Z';
  const poly = keys.map((k,i) => { const [x,y]=pt(Math.max(0.18,lv[k]/cap)*R,i); return `${i?'L':'M'}${x.toFixed(1)} ${y.toFixed(1)}`; }).join(' ')+' Z';
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ overflow: 'visible' }}>
      {[0.45,0.72,1].map((l,i) => <path key={i} d={ring(R*l)} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="0.7"/>)}
      {keys.map((k,i) => { const [x,y]=pt(R,i); return <line key={k} x1={cx} y1={cy} x2={x} y2={y} stroke="rgba(255,255,255,0.05)" strokeWidth="0.6"/>; })}
      <path d={poly} fill="rgba(167,139,250,0.26)" stroke={P.violet} strokeWidth="1.5" strokeLinejoin="round" style={{ filter: 'drop-shadow(0 0 6px rgba(167,139,250,0.5))' }}/>
      {keys.map((k,i) => { const [x,y]=pt(Math.max(0.18,lv[k]/cap)*R,i); return <circle key={k} cx={x} cy={y} r="2.6" fill={STAT_C[k]} style={{ filter:`drop-shadow(0 0 3px ${STAT_C[k]})` }}/>; })}
      {keys.map((k,i) => {
        const [x,y]=pt(R*1.32,i);
        return (
          <g key={k}>
            <text x={x} y={y-1} textAnchor="middle" fontFamily={P.sans} fontSize="8.5" fontWeight="800" fill={STAT_C[k]}>{k}</text>
            <text x={x} y={y+8} textAnchor="middle" fontFamily={P.mono} fontSize="7" fontWeight="700" fill={P.dim2}>Lv.{lv[k]}</text>
          </g>
        );
      })}
    </svg>
  );
}

    <div style={{ minHeight: '100vh', background: '#0a0a12', padding: '48px 0 100px' }}>
      <div style={{ textAlign: 'center', color: '#9090a8', fontFamily: '"JetBrains Mono", monospace', fontSize: 13, letterSpacing: 2, marginBottom: 8 }}>
        AWAKENED · APP STORE {IS_IPAD ? 'iPad 13″ · 2064 × 2752' : 'iPhone 6.9″ · 1320 × 2868'}
      </div>
      <div style={{ textAlign: 'center', color: '#5c5c78', fontFamily: '"JetBrains Mono", monospace', fontSize: 11, letterSpacing: 1, marginBottom: 44 }}>
        DevTools → right-click each <code style={{ color: '#f5b842' }}>.aso-shot</code> node → “Capture node screenshot”
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 64 }}>
        {ASO_SHOTS.map((s) => {
          const Screen = window[s.screen];
          return (
            <div key={s.id} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
              <div style={{ color: '#f5b842', fontFamily: '"JetBrains Mono", monospace', fontSize: 12, fontWeight: 800, letterSpacing: 2 }}>{s.label}</div>
              <div className="aso-shot" id={'aso-' + s.id} style={{ width: CW, height: CH, boxShadow: '0 24px 90px rgba(0,0,0,0.65)' }}>
                {IS_IPAD
                  ? <ASShotIPad kicker={s.kicker} headline={s.headline} hue={s.hue} hue2={s.hue2} glowHue={s.glowHue}>{Screen ? <Screen/> : null}</ASShotIPad>
                  : <ASShot kicker={s.kicker} headline={s.headline} hue={s.hue} hue2={s.hue2} glowHue={s.glowHue} scale={1}>{Screen ? <Screen/> : null}</ASShot>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

(function _boot() {
  const need = ['ASShot', 'ASPhone', 'ASBackground', 'ProfileScreen1', 'BattleScreen2', 'ReportShareScreen3', 'BossShareScreen4', 'LeaderboardScreen5'];
  if (need.every((n) => typeof window[n] !== 'undefined')) {
    // Shot 2 — owner wants the REAL Ascent battle capture (the design's recreation
    // used a geometric boss). Drop the real screenshot into the device screen and
    // mask its status bar (14:27 / SOS / recording dot) with a clean 9:41 bar.
    const StatusBar = window.ASStatusBar;
    window.BattleScreen2 = function BattleScreen2Real() {
      return (
        <div style={{ width: 390, height: 844, position: 'relative', overflow: 'hidden', background: '#07070f' }}>
          <img src="assets/02-ascent.jpeg" alt="" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'top center', display: 'block' }}
            onError={function (e) { e.currentTarget.style.display = 'none'; }} />
          <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 5, background: 'linear-gradient(180deg, #0a0a1a 0%, #0a0a1a 60%, rgba(10,10,26,0) 100%)' }}>
            {StatusBar ? <StatusBar /> : null}
          </div>
        </div>
      );
    };
    ReactDOM.createRoot(document.getElementById('root')).render(<ASOExport/>);
  } else {
    setTimeout(_boot, 80);
  }
})();

})();
</script>
</body>
</html>
