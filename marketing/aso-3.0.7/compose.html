<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Awakened 3.0.7 — App Store shot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@700;800&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* One App Store shot, 1320 × 2868 (iPhone 6.9"). compose.mjs loads this with
     ?shot=<name> and screenshots the page. The phone holds the REAL app capture
     from shoot.mjs; everything around it is the marketing frame. */
  :root { --acc: #f5b842; --acc2: #ffe3a3; --aura: 245, 184, 66; --aura2: 139, 92, 246; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1320px; height: 2868px; overflow: hidden; background: #05050b; }
  .shot { position: relative; width: 1320px; height: 2868px; overflow: hidden;
    background:
      radial-gradient(1100px 820px at 50% 1780px, rgba(var(--aura), .30), transparent 70%),
      radial-gradient(900px 560px at 50% 330px, rgba(var(--aura), .16), transparent 72%),
      radial-gradient(1400px 900px at 50% 2900px, rgba(var(--aura2), .22), transparent 70%),
      linear-gradient(180deg, #090912 0%, #05050b 60%, #07060e 100%); }
  /* a fine grain so the gradients never band */
  .grain { position: absolute; inset: 0; opacity: .06; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .art { position: absolute; left: -60px; right: -60px; top: -40px; height: 1900px; background-size: cover; background-position: center 20%;
    opacity: .62; filter: saturate(1.1) contrast(1.05);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 38%, rgba(0,0,0,.55) 62%, transparent 92%);
            mask-image: linear-gradient(180deg, #000 0%, #000 38%, rgba(0,0,0,.55) 62%, transparent 92%); }
  .veil { position: absolute; left: 0; right: 0; top: 0; height: 1100px;
    background: radial-gradient(900px 520px at 50% 390px, rgba(5,5,11,.82), rgba(5,5,11,.35) 70%, transparent 100%),
                linear-gradient(180deg, rgba(5,5,11,.55), transparent 40%); }
  .ember { position: absolute; border-radius: 50%; background: rgb(var(--aura)); filter: blur(2px); opacity: .55; }

  .copy { position: absolute; left: 0; right: 0; top: 176px; text-align: center; padding: 0 90px; }
  .kicker { display: inline-flex; align-items: center; gap: 28px; font: 800 33px/1 'JetBrains Mono', monospace;
    letter-spacing: .42em; text-transform: uppercase; color: var(--acc); padding-left: .42em; }
  .kicker::before, .kicker::after { content: ''; width: 70px; height: 2px; background: linear-gradient(90deg, transparent, var(--acc)); }
  .kicker::after { transform: scaleX(-1); }
  h1 { margin-top: 46px; font: 900 116px/1.06 'Cinzel', serif; color: #f6f1e7; letter-spacing: .01em;
    text-shadow: 0 6px 40px rgba(0,0,0,.6); }
  h1 em { font-style: normal; background: linear-gradient(180deg, var(--acc2) 10%, var(--acc) 70%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 28px rgba(var(--aura), .45)); }
  .sub { margin: 40px auto 0; max-width: 1020px; font: italic 500 52px/1.3 'Cormorant Garamond', serif; color: rgba(236, 230, 255, .74); }

  .glow { position: absolute; left: 50%; top: 1200px; width: 1100px; height: 1500px; transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(var(--aura), .34), transparent); filter: blur(40px); }
  .phone { position: absolute; left: 70px; top: 1000px; width: 1180px; padding: 18px; border-radius: 174px;
    background: linear-gradient(145deg, #3a3a46, #16161d 38%, #2a2a34 62%, #121218);
    box-shadow: 0 0 0 2px rgba(255,255,255,.07), 0 80px 180px rgba(0,0,0,.75), 0 0 160px rgba(var(--aura), .22); }
  .screen { position: relative; border-radius: 156px; overflow: hidden; background: #0a0a18; }
  .status { position: relative; height: 154px; background-size: 100% 100%; }
  .status .time { position: absolute; left: 132px; top: 56px; font: 700 47px/1 'Inter', sans-serif; color: #fff; letter-spacing: -.01em; }
  .island { position: absolute; left: 50%; top: 29px; width: 328px; height: 97px; transform: translateX(-50%); background: #000; border-radius: 49px; }
  .icons { position: absolute; right: 108px; top: 58px; display: flex; gap: 16px; align-items: center; }
  .cap { display: block; width: 100%; }
</style>
</head>
<body>
<div class="shot" id="shot">
  <div class="art" id="art"></div>
  <div class="veil"></div>
  <div class="grain"></div>
  <div id="embers"></div>
  <div class="copy">
    <div class="kicker" id="kicker"></div>
    <h1 id="headline"></h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="glow"></div>
  <div class="phone">
    <div class="screen">
      <div class="status" id="status">
        <div class="time">9:41</div>
        <div class="island"></div>
        <div class="icons">
          <svg width="52" height="32" viewBox="0 0 52 32"><rect x="0" y="20" width="9" height="12" rx="2" fill="#fff"/><rect x="14" y="14" width="9" height="18" rx="2" fill="#fff"/><rect x="28" y="7" width="9" height="25" rx="2" fill="#fff"/><rect x="42" y="0" width="9" height="32" rx="2" fill="#fff"/></svg>
          <svg width="46" height="34" viewBox="0 0 46 34"><path d="M23 30.5l6.2-6.4a8.9 8.9 0 0 0-12.4 0z M23 3a33 33 0 0 0-22 8.4l4.4 4.5a26.6 26.6 0 0 1 35.2 0l4.4-4.5A33 33 0 0 0 23 3z M23 13.5a21.8 21.8 0 0 0-14.8 5.8l4.4 4.5a15.4 15.4 0 0 1 20.8 0l4.4-4.5A21.8 21.8 0 0 0 23 13.5z" fill="#fff"/></svg>
          <svg width="76" height="36" viewBox="0 0 76 36"><rect x="1.5" y="1.5" width="64" height="33" rx="10" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="3"/><rect x="6" y="6" width="55" height="24" rx="6" fill="#fff"/><rect x="69" y="12" width="5" height="12" rx="2.5" fill="rgba(255,255,255,.45)"/></svg>
        </div>
      </div>
      <img class="cap" id="cap" alt="">
    </div>
  </div>
</div>
<script>
  // Accent = the moment's colour. <em> marks the one accent word.
  const SHOTS = {
    victory:  { acc: '#f5b842', acc2: '#ffe7ad', aura: '245,184,66',  aura2: '139,92,246',
      kicker: 'Real steps · real bosses', headline: 'Your steps<br>slay the <em>boss</em>.',
      sub: 'Walk, sleep, train. Apple Health keeps it honest.', art: 'assets/bosses/the-steel-wolf.png' },
    briefing: { acc: '#b69cff', acc2: '#e6dcff', aura: '139,92,246',  aura2: '245,184,66',
      kicker: 'Every morning', headline: 'Every day is<br>a <em>quest</em>.',
      sub: 'Your vows, your streak, your XP. One hold to begin.', art: 'assets/backgrounds/bg_s.webp' },
    coop:     { acc: '#b69cff', acc2: '#efe8ff', aura: '139,92,246',  aura2: '245,184,66',
      kicker: 'Co-op hunts', headline: 'Hunt with<br>your <em>friends</em>.',
      sub: 'Pool your steps. Share the spoils.', art: 'assets/bosses/the-twin-maw.png' },
    mvp:      { acc: '#ff6b5e', acc2: '#ffc9a8', aura: '239,68,68',   aura2: '245,184,66',
      kicker: 'The Worldgate', headline: 'One monster.<br><em>Everyone.</em>',
      sub: 'The whole server against one boss, every week.', art: 'assets/backgrounds/lb-bg-sgate.webp' },
    rank:     { acc: '#3ee0a6', acc2: '#c8fbe6', aura: '52,211,153',  aura2: '139,92,246',
      kicker: 'Rank up', headline: 'Rise from<br>E to <em>S</em>.',
      sub: 'Every vow you keep moves you up.' },
    habits:   { acc: '#f5b842', acc2: '#ffe7ad', aura: '245,184,66',  aura2: '139,92,246',
      kicker: 'A habit RPG', headline: 'Turn your habits<br>into an <em>RPG</em>.',
      sub: 'Keep your vows. Earn XP. Hunt real bosses.', art: 'assets/busts/avatar-paladin-bust.webp' },
  };
  const name = new URLSearchParams(location.search).get('shot') || 'victory';
  const s = SHOTS[name];
  const r = document.documentElement.style;
  r.setProperty('--acc', s.acc); r.setProperty('--acc2', s.acc2); r.setProperty('--aura', s.aura); r.setProperty('--aura2', s.aura2);
  document.getElementById('kicker').textContent = s.kicker;
  document.getElementById('headline').innerHTML = s.headline;
  document.getElementById('sub').textContent = s.sub;
  if (s.art) document.getElementById('art').style.backgroundImage = `url(../../${s.art})`;
  // embers: fixed positions (deterministic output)
  const E = [[160, 640, 7], [1150, 560, 5], [240, 1180, 4], [1110, 1320, 6], [90, 1760, 5], [1230, 1900, 4], [300, 430, 3], [1020, 250, 4], [60, 980, 3], [1260, 860, 3]];
  document.getElementById('embers').innerHTML = E.map(([x, y, d]) => `<i class="ember" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px"></i>`).join('');
  // the capture, and a status strip in the app's own top colour
  const img = document.getElementById('cap');
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = 1;
      c.getContext('2d').drawImage(img, 0, 0, img.naturalWidth, 1, 0, 0, img.naturalWidth, 1);
      document.getElementById('status').style.backgroundImage = `url(${c.toDataURL()})`;
    } catch (_) {}
    document.body.dataset.ready = '1';
  };
  img.src = 'raw/' + name + '.png?' + Date.now();
</script>
</body>
</html>
