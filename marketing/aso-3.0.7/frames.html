<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Awakened — App Store frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=JetBrains+Mono:wght@800&family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
  /* 2026-10-19 — App Review 2.3.3 ("The Product Page Header screenshot does not show the actual app
     in use") on the panorama set. Six self-contained 1320×2868 frames: a headline, then one upright
     phone holding a REAL capture (shoot.mjs), large and running off the bottom edge. No cut-out
     pieces floating over the frame, nothing crossing a seam. FREE TO PLAY stays, smaller, on 1–3.
     frames.mjs screenshots each frame. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 7920px; height: 2868px; overflow: hidden; background: #111; }
  .strip { position: relative; width: 7920px; height: 2868px; }
  .card { position: absolute; top: 0; width: 1320px; height: 2868px; overflow: hidden; }
  .card::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(1200px 900px at 50% -120px, rgba(255,255,255,.22), transparent 70%); }
  .doodle { position: absolute; opacity: .26; }

  .copy { position: absolute; left: 0; right: 0; text-align: center; padding: 0 70px; z-index: 5; }
  .free { display: inline-block; margin-bottom: 34px; font: 900 60px/1 'Cinzel', serif; letter-spacing: .05em; color: #2a1600;
    padding: 22px 56px 18px; border-radius: 999px; background: linear-gradient(180deg, #ffe48a, #f5b842 55%, #e0951f);
    box-shadow: 0 0 0 6px rgba(255,255,255,.5), 0 20px 44px rgba(0,0,0,.35); }
  .kicker { display: block; width: max-content; margin: 0 auto; font: 800 32px/1 'JetBrains Mono', monospace; letter-spacing: .32em; text-transform: uppercase;
    color: rgba(255,255,255,.92); background: rgba(0,0,0,.18); padding: 16px 28px 16px 40px; border-radius: 999px; }
  h1 { margin-top: 30px; font: 900 118px/1.02 'Cinzel', serif; color: #fff; letter-spacing: .005em;
    text-shadow: 0 8px 0 rgba(0,0,0,.20), 0 18px 46px rgba(0,0,0,.35); }
  h1 em { font-style: normal; color: #ffe27a; }

  .phone { position: absolute; padding: 22px; z-index: 3;
    background: linear-gradient(145deg, #4a4658, #1b1a24 40%, #2f2c3c 65%, #16151d);
    box-shadow: 0 0 0 3px rgba(255,255,255,.16), 0 60px 120px rgba(0,0,0,.45), 0 20px 40px rgba(0,0,0,.3); }
  .screen { position: relative; overflow: hidden; background: #0a0a18; }
  .status { position: relative; background-size: 100% 100%; }
  .status .time { position: absolute; font: 700 1px/1 'Inter', sans-serif; color: #fff; }
  .status .island { position: absolute; left: 50%; transform: translateX(-50%); background: #000; }
  .status .icons { position: absolute; display: flex; align-items: center; }
  .screen img { display: block; width: 100%; }
</style>
</head>
<body>
<div class="strip" id="strip"></div>
<script>
  const W = 1320, RAW_W = 1320;
  const strip = document.getElementById('strip');
  const el = (tag, cls, css, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; return e; };

  // shot = raw/<shot>.png. Every frame: a real screen.
  const FRAMES = [
    { shot: 'habits',  free: true, bg: 'linear-gradient(165deg, #8b5cf6 0%, #6d28d9 45%, #3b0f8c 100%)', kicker: 'A habit RPG',             h: 'Turn your habits<br>into an <em>RPG</em>.' },
    { shot: 'victory', free: true, bg: 'linear-gradient(165deg, #fb923c 0%, #ea580c 45%, #9a1c1c 100%)', kicker: 'Real steps · real bosses', h: 'Your steps<br>slay the <em>boss</em>.' },
    { shot: 'tower',   free: true, bg: 'linear-gradient(165deg, #38bdf8 0%, #2563eb 50%, #1e3a8a 100%)', kicker: 'The Ascent',               h: 'Climb the<br><em>Tower</em>.' },
    { shot: 'coop',                bg: 'linear-gradient(165deg, #2dd4bf 0%, #0d9488 50%, #134e4a 100%)', kicker: 'Co-op hunts',              h: 'Hunt with<br>your <em>friends</em>.' },
    { shot: 'mvp',                 bg: 'linear-gradient(165deg, #f472b6 0%, #c026d3 45%, #581c87 100%)', kicker: 'The Worldgate',            h: 'One monster.<br><em>Everyone.</em>' },
    { shot: 'relics',              bg: 'linear-gradient(165deg, #fcd34d 0%, #f59e0b 45%, #9a3412 100%)', kicker: 'Loot',                     h: 'Win legendary<br><em>relics</em>.' },
  ];
  const DOODLE = {
    rune: '<svg viewBox="0 0 60 60" width="100%" height="100%"><path d="M30 4 L54 30 L30 56 L6 30 Z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg>',
    star: '<svg viewBox="0 0 60 60" width="100%" height="100%"><path d="M30 3 L36 24 L57 30 L36 36 L30 57 L24 36 L3 30 L24 24 Z" fill="#fff"/></svg>',
    ring: '<svg viewBox="0 0 60 60" width="100%" height="100%"><circle cx="30" cy="30" r="22" fill="none" stroke="#fff" stroke-width="5"/></svg>',
    squig: '<svg viewBox="0 0 80 40" width="100%" height="100%"><path d="M4 30 Q 16 4 28 20 T 52 20 T 76 10" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>',
  };
  const SCATTER = [['rune', 70, 640, 64, 12], ['star', 1180, 560, 50, 0], ['squig', 1040, 260, 110, -18], ['ring', 60, 1400, 60, 0],
                   ['star', 1220, 1800, 44, 20], ['star', 200, 150, 38, 0]];

  const ready = [];
  // A phone at frame-local x/y, w wide, holding raw/<file>.png under a drawn status bar.
  function phone(card, file, x, y, w) {
    const s = (w - 44) / RAW_W;
    const sb = Math.round(177 * s);             // the 59pt status bar at 3×
    const p = el('div', 'phone', `left:${x}px;top:${y}px;width:${w}px;border-radius:${Math.round(w * .144)}px`);
    const screen = el('div', 'screen', `border-radius:${Math.round(w * .128)}px`);
    const st = el('div', 'status', `height:${sb}px`);
    st.appendChild(el('div', 'time', `left:${Math.round(s * 150)}px;top:${Math.round(s * 64)}px;font-size:${Math.round(s * 56)}px`, '9:41'));
    st.appendChild(el('div', 'island', `top:${Math.round(s * 33)}px;width:${Math.round(s * 378)}px;height:${Math.round(s * 111)}px;border-radius:${Math.round(s * 56)}px`));
    st.appendChild(el('div', 'icons', `right:${Math.round(s * 110)}px;top:${Math.round(s * 70)}px;gap:${Math.round(s * 18)}px`,
      `<svg width="${Math.round(s * 60)}" height="${Math.round(s * 37)}" viewBox="0 0 52 32"><rect x="0" y="20" width="9" height="12" rx="2" fill="#fff"/><rect x="14" y="14" width="9" height="18" rx="2" fill="#fff"/><rect x="28" y="7" width="9" height="25" rx="2" fill="#fff"/><rect x="42" y="0" width="9" height="32" rx="2" fill="#fff"/></svg>` +
      `<svg width="${Math.round(s * 53)}" height="${Math.round(s * 39)}" viewBox="0 0 46 34"><path d="M23 30.5l6.2-6.4a8.9 8.9 0 0 0-12.4 0z M23 3a33 33 0 0 0-22 8.4l4.4 4.5a26.6 26.6 0 0 1 35.2 0l4.4-4.5A33 33 0 0 0 23 3z M23 13.5a21.8 21.8 0 0 0-14.8 5.8l4.4 4.5a15.4 15.4 0 0 1 20.8 0l4.4-4.5A21.8 21.8 0 0 0 23 13.5z" fill="#fff"/></svg>` +
      `<svg width="${Math.round(s * 88)}" height="${Math.round(s * 42)}" viewBox="0 0 76 36"><rect x="1.5" y="1.5" width="64" height="33" rx="10" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="3"/><rect x="6" y="6" width="55" height="24" rx="6" fill="#fff"/><rect x="69" y="12" width="5" height="12" rx="2.5" fill="rgba(255,255,255,.45)"/></svg>`));
    const img = el('img');
    ready.push(new Promise((res) => { img.onload = () => {
      try { const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = 1;
        c.getContext('2d').drawImage(img, 0, 0, img.naturalWidth, 1, 0, 0, img.naturalWidth, 1);
        st.style.backgroundImage = `url(${c.toDataURL()})`; } catch (_) {}
      res(); }; img.onerror = () => res(); }));
    img.src = `raw/${file}.png`;
    screen.appendChild(st); screen.appendChild(img); p.appendChild(screen);
    card.appendChild(p);
  }

  FRAMES.forEach((f, i) => {
    const card = el('div', 'card', `left:${i * W}px;background:${f.bg}`);
    SCATTER.forEach(([k, x, y, s, r], j) => {
      const flip = (i + j) % 2 ? -1 : 1;
      card.appendChild(el('div', 'doodle', `left:${(flip < 0 ? W - x - s : x)}px;top:${y + ((i * 37) % 80)}px;width:${s}px;height:${s}px;transform:rotate(${r + i * 23}deg)`, DOODLE[k]));
    });
    const top = f.free ? 86 : 150;
    card.appendChild(el('div', 'copy', `top:${top}px`,
      (f.free ? '<div class="free">Free to play</div>' : '') + `<div class="kicker">${f.kicker}</div><h1>${f.h}</h1>`));
    phone(card, f.shot, 110, f.free ? 700 : 660, 1100);   // large, upright, running off the bottom edge
    strip.appendChild(card);
  });

  Promise.all(ready.concat([document.fonts.ready])).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
